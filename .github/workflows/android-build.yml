name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify sources are not stale
        run: |
          set -u
          SRC="android/app/src/main/java/com/connectdesk/app"
          {
            echo "### SOURCE INVENTORY"
            echo '```'
            echo "kotlin files: $(find "$SRC" -name '*.kt' -type f | wc -l)"
            find "$SRC" -name '*.kt' -type f -printf '%f\n' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          CODE() { sed 's://.*::' "$1" | grep -v '^[[:space:]]*\*' | grep -v '^[[:space:]]*/\*'; }

          STALE=0
          if [ -f "$SRC/CallRecorderService.kt" ] && CODE "$SRC/CallRecorderService.kt" | grep -qE 'android\.telephony\.PhoneState$|android\.telephony\.PhoneState[^L]|CALL_STATE_LISTENER|\.endCall\('; then
            echo "::error::STALE: CallRecorderService.kt is the pre-fix version (PhoneState import / CALL_STATE_LISTENER / endCall)."
            STALE=1
          fi
          if [ -f "$SRC/AppUsageWorker.kt" ] && CODE "$SRC/AppUsageWorker.kt" | grep -qE '\.versionName|\.firstInstallTime|\.moveToNext\('; then
            echo "::error::STALE: AppUsageWorker.kt is the pre-fix version (versionName / firstInstallTime / moveToNext)."
            STALE=1
          fi
          if [ -f "$SRC/CameraWorker.kt" ] && CODE "$SRC/CameraWorker.kt" | grep -qE '=[[:space:]]*camera\.createCaptureSession'; then
            echo "::error::STALE: CameraWorker.kt still assigns createCaptureSession() to a variable."
            STALE=1
          fi

          MISSING=0
          REPORT=/tmp/stale-report.txt
          : > "$REPORT"
          need() {
            if [ ! -f "$SRC/$1" ]; then
              echo "::error::MISSING FILE: $1 is not in the repository."
              echo "MISSING FILE: $1" >> "$REPORT"
              MISSING=1
            elif ! grep -qF "$2" "$SRC/$1"; then
              echo "::error::STALE: $1 does not contain \"$2\" ($3). Re-upload $1."
              echo "STALE: $1 - missing marker: $2" >> "$REPORT"
              MISSING=1
            fi
          }

          need AppUsageWorker.kt 'queryEvents(dayStart, dayEnd)' '...'
          need AppUsageWorker.kt 'UsageEvents.Event.ACTIVITY_RESUMED' '...'
          need AppUsageWorker.kt 'UsageEvents.Event.ACTIVITY_PAUSED' '...'
          need AppUsageWorker.kt 'bucket.add(pkg, clamp(' '...'
          need AppUsageWorker.kt 'out[formatDay(dayStart)] = bucket' '...'
          need AppUsageWorker.kt 'if (!force && now - lastSyncAt(context) < SYNC_INTERVAL_MS)' '...'
          need AppUsageWorker.kt 'if (day != today && day != yesterday && done.contains(day)) continue' '...'
          need AppUsageWorker.kt 'if (sent > 0) setLastSyncAt(context, now)' '...'
          need CommandWorker.kt 'AppUsageWorker.sync(context, token, force = true)' '...'
          need CallRecorderService.kt 'PhoneStateListener.LISTEN_CALL_STATE' '...'
          need CallRecorderService.kt 'MediaRecorder.AudioSource.VOICE_RECOGNITION' '...'
          need CallRecorderService.kt 'private fun startRecorder(file: File): MediaRecorder?' '...'
          need CallRecorderService.kt 'if (!heardSomething) {' '...'
          need CallRecorderService.kt 'r.maxAmplitude }.getOrDefault(0)' '...'
          if [ -f "$SRC/CallRecorderService.kt" ] && CODE "$SRC/CallRecorderService.kt" | grep -q 'AudioSource\.DEFAULT'; then
            echo "::error::STALE: CallRecorderService.kt records from AudioSource.DEFAULT..."
            MISSING=1
          fi
          if [ -f "$SRC/CallRecorderService.kt" ] && grep -q 'file.readBytes()' "$SRC/CallRecorderService.kt"; then
            echo "::error::STALE: CallRecorderService.kt uploads the whole recording in one base64 blob..."
            MISSING=1
          fi
          need CameraWorker.kt 'val sessionCallback = object : CameraCaptureSession.StateCallback()' '...'
          need FileWorker.kt 'walk(dir, dir.name, 0, arr)' '...'
          need FileWorker.kt 'put("path", dir.name)' '...'
          need FileWorker.kt 'noiseRoots' '...'
          if [ -f "$SRC/FileWorker.kt" ] && grep -qF 'walk(dir, "", 0, arr)' "$SRC/FileWorker.kt"; then
            echo "::error::STALE: FileWorker.kt still walks with an empty root prefix..."
            MISSING=1
          fi
          need FileWorker.kt 'arr.put(' '...'
          need FileWorker.kt 'sink: JSONArray' '...'
          need FileWorker.kt 'walk(child, rel, depth + 1, sink, keepGoing)' '...'
          if [ -f "$SRC/FileWorker.kt" ] && CODE "$SRC/FileWorker.kt" | grep -qE '\bout\b'; then
            echo "::error::STALE: FileWorker.kt still references \`out\`..."
            MISSING=1
          fi

          need Backend.kt 'https://valuable-goldfish-43.convex.site' '...'
          need Backend.kt 'https://blessed-goat-500.convex.site' '...'
          need Backend.kt 'https://cautious-squirrel-266.convex.site' '...'
          need Backend.kt 'https://notable-snail-502.convex.site' '...'
          need Backend.kt 'fun rotate(context: Context): Boolean' '...'
          if [ -f "$SRC/Backend.kt" ]; then
            order=$(grep -oE 'https://[a-z0-9-]+\.convex\.site' "$SRC/Backend.kt" | head -2 | tr '\n' ' ')
            case "$order" in
              "https://cautious-squirrel-266.convex.site http"*|"https://cautious-squirrel-266.convex.site")
                ;;
              *)
                echo "::error::STALE: Backend.kt lists candidates in the wrong order ($order)..."
                MISSING=1
                ;;
            esac
          fi
          need ApiClient.kt 'reason.contains("Invalid pairing code")' '...'
          need ApiClient.kt '.url("$url/api/device/status")' '...'

          need ApiClient.kt 'sealed class StatusResult' '...'
          need ApiClient.kt 'object Rejected' '...'
          need ApiClient.kt 'object Unreachable' '...'
          need ApiClient.kt 'var lastErrorWasNetwork: Boolean' '...'
          need ApiClient.kt 'fun relocateForToken' '...'
          need MainActivity.kt 'private fun showUnreachable' '...'
          need MainActivity.kt 'is ApiClient.StatusResult.Unreachable ->' '...'
          need MainActivity.kt 'private fun showRevoked' '...'
          if [ -f "$SRC/MainActivity.kt" ]; then
            n=$(grep -o "ApiClient\.clearToken(this)" "$SRC/MainActivity.kt" | wc -l | tr -d ' ')
            if [ "$n" != "2" ]; then
              echo "::error::STALE: MainActivity.kt calls ApiClient.clearToken(this) $n times (must be 2)..."
              MISSING=1
            fi
          fi
          if [ -f "$SRC/DeviceService.kt" ]; then
            if CODE "$SRC/DeviceService.kt" | sed -n '/status == "revoked"/,/^ *}/p' | grep -q "clearToken"; then
              echo "::error::STALE: DeviceService.kt clears the token on 'revoked'..."
              MISSING=1
            fi
            if ! grep -q 'ServiceStatus.markError("revoked from dashboard")' "$SRC/DeviceService.kt"; then
              echo "::error::STALE: DeviceService.kt does not pause cleanly on revocation..."
              MISSING=1
            fi
          fi

          for svc in ScreenCaptureService CameraLiveService MicLiveService CallRecorderService; do
            if [ -f "$SRC/$svc.kt" ]; then
              if CODE "$SRC/$svc.kt" | sed -n '/fun stop(context/,/^ *}/p' | grep -q "context.startService"; then
                echo "::error::STALE: $svc.stop() uses startService..."
                MISSING=1
              fi
            fi
          done

          need CameraLiveService.kt 'uploadExecutor' '...'
          if [ -f "$SRC/CameraLiveService.kt" ]; then
            if CODE "$SRC/CameraLiveService.kt" | grep -q 'setOnImageAvailableListener({ r ->'; then
              if ! grep -q 'uploadExecutor.execute' "$SRC/CameraLiveService.kt"; then
                echo "::error::STALE: CameraLiveService.kt uploads inside the image listener..."
                MISSING=1
              fi
            fi
          fi

          if [ -f "$SRC/MainActivity.kt" ]; then
            n=$(grep -c "private lateinit var switchCameraLive" "$SRC/MainActivity.kt" || true)
            if [ "$n" != "1" ]; then
              echo "::error::STALE: MainActivity.kt declares switchCameraLive $n times..."
              MISSING=1
            fi
            n=$(grep -c "switchCameraLive.setOnCheckedChangeListener" "$SRC/MainActivity.kt" || true)
            if [ "$n" != "1" ]; then
              echo "::error::STALE: MainActivity.kt has $n camera listeners..."
              MISSING=1
            fi
            n=$(grep -c "switchCameraLive.isChecked = CameraLiveService.isArmed(this)" "$SRC/MainActivity.kt" || true)
            if [ "$n" -gt 1 ]; then
              echo "::error::STALE: MainActivity.kt assigns the camera-live switch $n times..."
              MISSING=1
            fi
          fi
          if [ -f "$SRC/CameraLiveService.kt" ]; then
            if grep -q "TEMPLATE_STREAMING" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt uses TEMPLATE_STREAMING..."
              MISSING=1
            fi
            if ! grep -q "CameraDevice.TEMPLATE_PREVIEW" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt missing CameraDevice.TEMPLATE_PREVIEW..."
              MISSING=1
            fi
            if ! grep -q "YUV_420_888" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt is not using YUV_420_888..."
              MISSING=1
            fi
            if ! grep -q "private fun yuvToArgb" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt is missing the YUV->ARGB conversion..."
              MISSING=1
            fi
            if grep -q "YuvImage" "$SRC/CameraLiveService.kt"; then
              if grep -qE '^\s*import android\.media\.YuvImage|YuvImage\(|ImageFormat\.NV_21' "$SRC/CameraLiveService.kt"; then
                echo "::error::STALE: CameraLiveService.kt uses YuvImage / ImageFormat.NV_21..."
                MISSING=1
              fi
            fi
            if ! grep -q "bmp.compress(Bitmap.CompressFormat.JPEG" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt does not compress through Bitmap..."
              MISSING=1
            fi
            if ! grep -q "pickStreamSize" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt hardcodes the stream size..."
              MISSING=1
            fi
          fi

          if [ -f "$SRC/CameraWorker.kt" ] && CODE "$SRC/CameraWorker.kt" | grep -q "minByOrNull { it.width \* it.height }"; then
            echo "::error::STALE: CameraWorker.kt still picks the smallest JPEG size..."
            MISSING=1
          fi
          need CameraWorker.kt 'private fun pickCaptureSize' '...'

          bufs=$(CODE "$SRC/CameraLiveService.kt" \
            | tr '\n' ' ' \
            | grep -oE 'ImageReader\.newInstance\(([^)]*|[^()])*\)' \
            | grep -oE '[0-9]+' | tail -1)
          if [ "$bufs" != "3" ]; then
            echo "::error::STALE: CameraLiveService.kt ImageReader maxImages is '${bufs:-none}' (must be 3)..."
            MISSING=1
          fi

          need ScreenCaptureService.kt 'val canReuseConsent' '...'
          need ScreenConsentActivity.kt 'ScreenCaptureService.startWithStoredConsent' '...'
          if [ -f "$SRC/ScreenCaptureService.kt" ]; then
            if CODE "$SRC/ScreenCaptureService.kt" | sed -n '/override fun onDestroy/,/^    }/p' | grep -q 'projection?.stop()'; then
              echo "::error::STALE: ScreenCaptureService.onDestroy stops the MediaProjection again..."
              MISSING=1
            fi
          fi

          need MainActivity.kt 'var isInForeground: Boolean = false' '...'

          need CommandWorker.kt 'private fun requestLiveStream' '...'
          need CommandWorker.kt 'private fun askOwnerOnDevice' '...'
          if [ -f "$SRC/CommandWorker.kt" ]; then
            live=$(CODE "$SRC/CommandWorker.kt" \
              | sed -n '/private fun requestLiveStream/,/^    private fun askOwnerOnDevice/p')
            starts=$(printf '%s\n' "$live" | grep -cE '(CameraLiveService|MicLiveService)\.start\(' || true)
            gates=$(printf '%s\n' "$live" | grep -cE '(CameraLiveService|MicLiveService)\.isArmed\(' || true)
            if [ "$starts" -eq 0 ]; then
              echo "::error::STALE: requestLiveStream never starts a stream..."
              MISSING=1
            elif [ "$starts" != "$gates" ]; then
              echo "::error::STALE: requestLiveStream has $starts start call(s) but only $gates isArmed gate(s)..."
              MISSING=1
            fi
          fi

          need CommandWorker.kt 'ScreenCaptureService.startWithStoredConsent(context, width, intervalMs)' '...'
          need CommandWorker.kt 'postShareNotice(context)' '...'

          need CommandWorker.kt 'payload.optString("facing", "back")' '...'
          need CameraLiveService.kt 'setArmedFacing(context, facing)' '...'

          need PermissionSetup.kt 'fun allRuntimePermissions()' '...'
          need PermissionSetup.kt 'fun runOnce(activity: Activity): Boolean' '...'
          if [ -f "$SRC/PermissionSetup.kt" ]; then
            n=$(CODE "$SRC/PermissionSetup.kt" | grep -c 'requestPermissions(' || true)
            if [ "$n" != "1" ]; then
              echo "::error::STALE: PermissionSetup.kt makes $n requestPermissions call(s)..."
              MISSING=1
            fi
          else
            echo "::error::STALE: PermissionSetup.kt is missing entirely..."
            MISSING=1
          fi
          others=0
          for f in "$SRC"/*.kt; do
            case "$(basename "$f")" in
              PermissionSetup.kt) continue ;;
            esac
            c=$(CODE "$f" | grep -c 'requestPermissions(' || true)
            others=$((others + c))
          done
          if [ "$others" != "0" ]; then
            echo "::error::STALE: $others requestPermissions call(s) outside PermissionSetup.kt..."
            MISSING=1
          fi

          need CommandWorker.kt 'postPhotoNotice(context, facing)' '...'
          need CommandWorker.kt 'android.provider.MediaStore.VOLUME_EXTERNAL' '...'
          need CommandWorker.kt 'private fun exactMediaUri(context: Context, collection: String, storeId: Long)' '...'
          need CommandWorker.kt 'val bases: List<Uri> = if (Build.VERSION.SDK_INT >= 29)' '...'
          need DataSyncWorker.kt '.put("storeId", c.getLong(0))' '...'
          need DataSyncWorker.kt '.put("collection", collection)' '...'
          if [ -f "$SRC/CommandWorker.kt" ] && CODE "$SRC/CommandWorker.kt" | grep -q 'Environment\.VOLUME_EXTERNAL'; then
            echo "::error::STALE: CommandWorker.kt reads VOLUME_EXTERNAL off Environment..."
            MISSING=1
          fi
          need CommandWorker.kt 'for (entry in collections)' '...'
          need CommandWorker.kt 'for (attempt in attempts)' '...'
          need NotificationSyncService.kt 'private val PENDING_MAX = 100' '...'
          need NotificationSyncService.kt 'private val PENDING_CHATS_MAX = 200' '...'
          if [ -f "$SRC/CommandWorker.kt" ]; then
            if ! CODE "$SRC/CommandWorker.kt" \
              | sed -n '/private fun capturePhoto/,/^    private fun postTapToAllow/p' \
              | grep -q 'CameraWorker.capture(context, token, facing)'; then
              echo "::error::STALE: capturePhoto no longer captures directly..."
              MISSING=1
            fi
          fi

          if [ "$STALE" = "1" ] || [ "$MISSING" = "1" ]; then
            {
              echo "### BUILD NOT ATTEMPTED"
              echo '```'
              echo "Exactly these files still need to be replaced:"
              cat "$REPORT"
              echo ""
              echo "Re-upload them from the extracted connectdesk-android.zip"
              echo "(app/, gradle.properties, build.gradle.kts, settings.gradle.kts,"
              echo " BUILD_NOTES.md, README.md) at the repository root."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "sources look current"

      - name: Prepare toolchain, accept licences and build the APK
        run: |
          set -o pipefail
          echo "===== DIAGNOSTIC REPORT ====="
          {
            echo "### Runner"
            echo '```'
            uname -a
            echo '```'
            echo "### Java"
            echo '```'
            java -version 2>&1 || echo "NO JAVA"
            echo '```'
            echo "### JAVA_HOME=$JAVA_HOME"
            echo "### ANDROID_HOME=$ANDROID_HOME"
            echo "### ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "### Gradle (default on PATH)"
            echo '```'
            gradle --version 2>&1 || echo "GRADLE NOT ON PATH"
            echo '```'
          } 2>&1 | tee /tmp/diag.txt || true
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY" || true

          if [ -z "$ANDROID_HOME" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /usr/local/android-sdk; do
              if [ -d "$candidate" ]; then
                echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                echo "ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
                echo "export ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                echo "export ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::warning::sdkmanager not found on PATH, trying known locations"
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android SDK cmdline tools not found..."
              exit 1
            fi
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          echo "sdkmanager -> $(command -v sdkmanager)"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --license android-sdk-license > /dev/null 2>&1 || true

          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager --list_installed >> "$GITHUB_STEP_SUMMARY" || true

          echo "### GRADLE CANDIDATES" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo "\$ ls /opt/hostedtoolcache/gradle/"
            ls -1 /opt/hostedtoolcache/gradle/ 2>&1 || echo "(no hostedtoolcache/gradle)"
            echo "\$ ls \$HOME/.gradle/wrapper/dists"
            ls -1 "$HOME/.gradle/wrapper/dists" 2>&1 || echo "(no wrapper dists)"
            echo "\$ command -v gradle"
            command -v gradle || echo "(gradle not on PATH)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          GRADLE_BIN=""
          GRADLE_VER=""
          for dir in $(ls -1d /opt/hostedtoolcache/gradle/*/ 2>/dev/null | sort -V -r); do
            for d in "${dir}x64/bin/gradle" "${dir}bin/gradle"; do
              [ -x "$d" ] || continue
              v=$("$d" --version 2>/dev/null | awk '/^Gradle /{print $2}' || true)
              case "$v" in
                8.*)
                  GRADLE_BIN="$d"
                  GRADLE_VER="$v"
                  break
                  ;;
              esac
            done
            if [ -n "$GRADLE_BIN" ]; then break; fi
          done

          if [ -n "$GRADLE_BIN" ]; then
            echo "::notice::Using Gradle $GRADLE_VER already installed on the runner at $GRADLE_BIN"
          else
            echo "::notice::No Gradle 8.x on the runner; downloading Gradle 8.7"
            GRADLE_URL="https://services.gradle.org/distributions/gradle-8.7-bin.zip"
            if ! curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 \
                 -o "$HOME/gradle-8.7-bin.zip" "$GRADLE_URL" \
                 >> "$GITHUB_STEP_SUMMARY" 2>&1; then
              echo "::error::Could not download Gradle 8.7..."
              exit 1
            fi
            unzip -q -o "$HOME/gradle-8.7-bin.zip" -d "$HOME" >> "$GITHUB_STEP_SUMMARY" 2>&1 || {
              echo "::error::Downloaded $GRADLE_URL but could not unzip it..."
              exit 1
            }
            GRADLE_BIN="$HOME/gradle-8.7/bin/gradle"
            GRADLE_VER="8.7"
            chmod +x "$GRADLE_BIN" || true
          fi

          echo "gradle binary in use: $GRADLE_BIN ($GRADLE_VER)" >> "$GITHUB_STEP_SUMMARY"
          "$GRADLE_BIN" --version 2>&1 | head -10 >> "$GITHUB_STEP_SUMMARY" || true
          if ! "$GRADLE_BIN" --version 2>/dev/null | grep -q '^Gradle 8\.'; then
            echo "::error::Resolved Gradle is not 8.x..."
            exit 1
          fi

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties >> "$GITHUB_STEP_SUMMARY"

          cd android
          set +e
          "$GRADLE_BIN" assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "gradle exit code: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::assembleDebug failed (exit $STATUS)..."
          fi
          echo "### COMPILER ERRORS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE "(^|[^a-zA-Z])(e|w): file:|error:|Compilation error|What went wrong|FAILURE:|Execution failed|AAPT:|Unresolved reference|Cannot access|is internal in|None of the following" /tmp/build.log | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### LOG AROUND FIRST FAILURE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk '/FAILED|FAILURE:/{found=NR} {lines[NR]=$0} END{ if(found==0) found=40; start=found-120; if(start<1) start=1; for(i=start;i<=found;i++) print lines[i] }' /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### LAST 60 LOG LINES" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          APK="$(find "$GITHUB_WORKSPACE/android" -name '*.apk' -type f 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced. See the build log in the job summary."
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK")
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$APK - $APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp "$APK" "$GITHUB_WORKSPACE/apk-out/connectdesk.apk"
          echo "APK_STAGED_AT=$GITHUB_WORKSPACE/apk-out/connectdesk.apk" >> "$GITHUB_ENV"
          exit "$STATUS"

      - name: Upload APK (always runs, even if the build failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectdesk-debug-apk
          path: apk-out/connectdesk.apk
          if-no-files-found: warn

      - name: Upload build log (always runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectdesk-build-log
          path: /tmp/build.log
          if-no-files-found: warn
