name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare toolchain, accept licences and build the APK
        run: |
          set -o pipefail
          echo "===== DIAGNOSTIC REPORT ====="
          {
            echo "### Runner"
            echo '```'
            uname -a
            echo '```'
            echo "### Java"
            echo '```'
            java -version 2>&1 || echo "NO JAVA"
            echo '```'
            echo "### JAVA_HOME=$JAVA_HOME"
            echo "### ANDROID_HOME=$ANDROID_HOME"
            echo "### ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "### Gradle"
            echo '```'
            gradle --version 2>&1 || echo "GRADLE NOT ON PATH"
            echo '```'
          } 2>&1 | tee /tmp/diag.txt || true
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY" || true

          if [ -z "$ANDROID_HOME" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /usr/local/android-sdk; do
              if [ -d "$candidate" ]; then
                echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                echo "ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
                echo "export ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                echo "export ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::warning::sdkmanager not found on PATH, trying known locations"
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android SDK cmdline tools not found - install Android Studio once, or add cmdline-tools to the runner image."
              exit 1
            fi
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          echo "sdkmanager -> $(command -v sdkmanager)"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --license android-sdk-license > /dev/null 2>&1 || true

          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager --list_installed >> "$GITHUB_STEP_SUMMARY" || true

          NEED_GRADLE=1
          if command -v gradle >/dev/null 2>&1; then
            GMV="$(gradle --version 2>/dev/null | awk '/^Gradle /{print $2}')"
            echo "preinstalled gradle version: ${GMV:-unknown}"
            GMN="$(echo "${GMV:-0.0}" | cut -d. -f1,2)"
            if [ -n "$GMV" ]; then
              LOWEST="8.2"
              if [ "$(printf '%s\n%s\n' "$LOWEST" "$GMN" | sort -V | head -1)" = "$LOWEST" ]; then
                NEED_GRADLE=0
              fi
            fi
          fi
          if [ "$NEED_GRADLE" = "1" ]; then
            echo "::warning::Installing Gradle 8.7 (missing or older than 8.2)"
            curl -fsSL --retry 3 -o /tmp/gradle.zip \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip
            sudo unzip -q -o /tmp/gradle.zip -d /opt
            echo "export PATH=/opt/gradle-8.7/bin:$PATH" >> "$GITHUB_ENV"
            export PATH="/opt/gradle-8.7/bin:$PATH"
          fi
          gradle --version >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties >> "$GITHUB_STEP_SUMMARY"

          cd android
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "gradle exit code: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true

          APK="$(find "$GITHUB_WORKSPACE/android" -name '*.apk' -type f 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced. See the build log in the job summary."
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK")
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$APK - $APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp "$APK" "$GITHUB_WORKSPACE/apk-out/connectdesk.apk"
          echo "APK_STAGED_AT=$GITHUB_WORKSPACE/apk-out/connectdesk.apk" >> "$GITHUB_ENV"

      - name: Upload APK (always runs, even if the build failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectdesk-debug-apk
          path: apk-out/connectdesk.apk
          if-no-files-found: warn
