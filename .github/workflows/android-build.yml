name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

jobs:
  build:
    # 22.04 is the stable image: Android SDK + Gradle preinstalled and it is
    # not affected by the ubuntu-latest -> Ubuntu 26 migration.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Fails fast (and says exactly what to do) when the repo copy of the
      # Kotlin sources is older than the fixed ones. Without this the build
      # just emits five cryptic compiler errors and wastes 90 seconds.
      - name: Verify sources are not stale
        run: |
          set -u
          SRC="android/app/src/main/java/com/connectdesk/app"
          {
            echo "### SOURCE INVENTORY"
            echo '```'
            echo "kotlin files: $(find "$SRC" -name '*.kt' -type f | wc -l)"
            find "$SRC" -name '*.kt' -type f -printf '%f\n' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Strip line comments first: the fixed CallRecorderService.kt still
          # MENTIONS PhoneState inside an explanatory comment, so a naive grep
          # would flag the good file as stale.
          CODE() { sed 's://.*::' "$1" | grep -v '^[[:space:]]*\*' | grep -v '^[[:space:]]*/\*'; }

          STALE=0
          if [ -f "$SRC/CallRecorderService.kt" ] && CODE "$SRC/CallRecorderService.kt" | grep -qE 'android\.telephony\.PhoneState$|android\.telephony\.PhoneState[^L]|CALL_STATE_LISTENER|\.endCall\('; then
            echo "::error::STALE: CallRecorderService.kt is the pre-fix version (PhoneState import / CALL_STATE_LISTENER / endCall)."
            STALE=1
          fi
          if [ -f "$SRC/AppUsageWorker.kt" ] && CODE "$SRC/AppUsageWorker.kt" | grep -qE '\.versionName|\.firstInstallTime|\.moveToNext\('; then
            echo "::error::STALE: AppUsageWorker.kt is the pre-fix version (versionName / firstInstallTime / moveToNext)."
            STALE=1
          fi
          if [ -f "$SRC/CameraWorker.kt" ] && CODE "$SRC/CameraWorker.kt" | grep -qE '=[[:space:]]*camera\.createCaptureSession'; then
            echo "::error::STALE: CameraWorker.kt still assigns createCaptureSession() to a variable."
            STALE=1
          fi
          # ---- Positive checks: the fixed sources MUST contain these tokens.
          # Absence-of-bad-pattern is unreliable, presence-of-good-pattern is
          # not, so assert on the fix itself.
          MISSING=0
          REPORT=/tmp/stale-report.txt
          : > "$REPORT"
          need() { # need <file> <marker> <human label>
            if [ ! -f "$SRC/$1" ]; then
              echo "::error::MISSING FILE: $1 is not in the repository."
              echo "MISSING FILE: $1" >> "$REPORT"
              MISSING=1
            elif ! grep -qF "$2" "$SRC/$1"; then
              echo "::error::STALE: $1 does not contain \"$2\" ($3). Re-upload $1. IF YOUR SOURCE IS CURRENT, THE REAL PROBLEM IS A STALE COPY OF THIS WORKFLOW FILE (.github/workflows/android-build.yml) -- an out-of-date guard calls good code \"old\". Re-upload the workflow too, then re-run."
              echo "STALE: $1 - missing marker: $2" >> "$REPORT"
              MISSING=1
            fi
          }
          need AppUsageWorker.kt 'val rows: List<UsageStats>' 'fixed UsageStats loop is missing'
          need AppUsageWorker.kt 'for (us in rows)' 'fixed UsageStats loop is missing'
          need AppUsageWorker.kt 'queryUsageStats(interval, beginTime, endTime)' '3-arg queryUsageStats overload is missing'
          need CallRecorderService.kt 'PhoneStateListener.LISTEN_CALL_STATE' 'fixed call-state bitmask is missing'
          need CameraWorker.kt 'val sessionCallback = object : CameraCaptureSession.StateCallback()' 'fixed capture-session callback is missing'
          # FileWorker.kt drives the whole folder tree. Without the root-prefixed
          # walk every top-level folder collapses into one flat list on the
          # dashboard, which reads as "files are broken". Assert on the fix.
          need FileWorker.kt 'walk(dir, dir.name, 0, arr)' 'folder tree walk does not keep the root folder prefix'
          need FileWorker.kt 'put("path", dir.name)' 'root folder itself is not pushed as an entry'
          need FileWorker.kt 'noiseRoots' 'folder walk is still on the old allow-list instead of the noise deny-list'
          if [ -f "$SRC/FileWorker.kt" ] && grep -qF 'walk(dir, "", 0, arr)' "$SRC/FileWorker.kt"; then
            echo "::error::STALE: FileWorker.kt still walks with an empty root prefix. Re-upload it."
            echo "FileWorker.kt - walk(dir, \"\", 0, arr) still present" >> "$REPORT"
            MISSING=1
          fi
          # The buffer inside scanAndSync() is `arr`; `out` used to be the name
          # of walk()'s parameter. Mixing them up compiles nowhere and produced
          # "Unresolved reference: out" - so assert the buffer names are not
          # conflated any more.
          need FileWorker.kt 'arr.put(' 'scanAndSync is not writing the root folder into its own buffer'
          need FileWorker.kt 'sink: JSONArray' 'walk() buffer is not named sink'
          need FileWorker.kt 'walk(child, rel, depth + 1, sink, keepGoing)' 'recursive walk() call still passes the old buffer name'
          # `out` was walk()'s old parameter name. It has to be gone EVERYWHERE -
          # as a receiver, as a lambda argument, as a plain argument. Two CI runs
          # in a row died on it (once in scanAndSync, once in the recursive
          # call), so check the whole file rather than one statement shape.
          if [ -f "$SRC/FileWorker.kt" ] && CODE "$SRC/FileWorker.kt" | grep -qE '\bout\b'; then
            echo "::error::STALE: FileWorker.kt still references \`out\`. The buffers are now \`arr\` (scanAndSync) and \`sink\` (walk). Re-upload it."
            echo "FileWorker.kt - bare identifier 'out' still present (should be arr/sink)" >> "$REPORT"
            MISSING=1
          fi

          # Pairing lives or dies on the device asking the SAME Convex
          # deployment that the dashboard wrote the code to. If valuable-goldfish
          # is not listed FIRST the phone claims against the wrong database and
          # reports "Invalid pairing code" for a perfectly valid code.
          need Backend.kt 'https://valuable-goldfish-43.convex.site' 'the previously-primary deployment is missing from Backend.candidates'
          need Backend.kt 'https://blessed-goat-500.convex.site' 'the deployment `convex dev` actually pushes to (and that serves every current function) is missing from Backend.candidates'
          # The dashboard writes the pairing code on the deployment its build
          # resolves to. Omitting it from the phone is exactly what produced
          # `HTTP 400 Invalid pairing code` for a code created on screen.
          need Backend.kt 'https://notable-snail-502.convex.site' 'the deployment the DASHBOARD creates pairing codes on is missing from Backend.candidates, so every pairing fails with HTTP 400'
          need Backend.kt 'fun rotate(context: Context): Boolean' 'deployment-mismatch recovery (Backend.rotate) is missing'
          if [ -f "$SRC/Backend.kt" ]; then
            # ORDER MATTERS: the pairing code is written to ONE deployment, so
            # the phone must ask that same deployment for it. The dashboard
            # resolves to notable-snail-502 (its configured URL is probed before
            # any fallback and it is healthy), so that one must be FIRST here or
            # pairing returns HTTP 400 "Invalid pairing code".
            order=$(grep -oE 'https://[a-z0-9-]+\.convex\.site' "$SRC/Backend.kt" | head -2 | tr '\n' ' ')
            case "$order" in
              "https://notable-snail-502.convex.site http"*|"https://notable-snail-502.convex.site")
                ;;
              *)
                echo "::error::STALE: Backend.kt lists candidates in the wrong order ($order). notable-snail-502 must be FIRST -- it is the deployment the dashboard creates pairing codes on; otherwise pairing fails with HTTP 400 \"Invalid pairing code\"."
                echo "Backend.kt - candidate order wrong ($order)" >> "$REPORT"
                MISSING=1
                ;;
            esac
          fi
          # Match the expression, not the `if`/`if (!...)` wrapper: the retry walk was
          # extended to loop over every candidate, and a marker that pins the
          # negatin would call the NEW file "old" -- which is exactly the
          # false alarm this guard is supposed to avoid.
          need ApiClient.kt 'reason.contains("Invalid pairing code")' 'claim() no longer retries on the other deployment'
          need ApiClient.kt '.url("$url/api/device/status")' 'probe is not asserting on our own response shape'

          # ---- No automatic logout -------------------------------------------
          # MainActivity used to treat a NULL status response as "logged out".
          # A null response is what you get for no signal, a timeout, a 5xx or
          # a paused backend, so the phone silently threw the user back to the
          # sign-in form and lost the pairing without anyone doing anything.
          # The fix separates the three cases, and these markers make sure the
          # separated version is what gets compiled.
          need ApiClient.kt 'sealed class StatusResult' 'status can no longer distinguish "unknown token" from "could not reach the server"'
          need ApiClient.kt 'object Rejected' 'a rejected token is not distinguishable from an outage'
          need ApiClient.kt 'object Unreachable' 'an unreachable server is treated as a logout'
          need ApiClient.kt 'var lastErrorWasNetwork: Boolean' 'post() no longer records whether the failure was a network failure'
          need ApiClient.kt 'fun relocateForToken' 'deployment rotation is not distinguished from a real logout'
          need MainActivity.kt 'private fun showUnreachable' 'an outage still sends the user back to the login screen'
          need MainActivity.kt 'is ApiClient.StatusResult.Unreachable ->' 'refreshUi() does not branch on an unreachable server'
          need MainActivity.kt 'private fun showRevoked' 'a server-side revoke wipes the pairing instead of pausing it'
          # clearToken must appear EXACTLY TWICE: once in disconnect() (the
          # user pressing Disconnect) and once in the branch where every
          # deployment rejected the token. Any third call site is a silent
          # logout that no one asked for.
          if [ -f "$SRC/MainActivity.kt" ]; then
            # `grep -c` counts LINES, so two calls on one line would slip past.
            # Count occurrences instead.
            n=$(grep -o "ApiClient\.clearToken(this)" "$SRC/MainActivity.kt" | wc -l | tr -d ' ')
            if [ "$n" != "2" ]; then
              echo "::error::STALE: MainActivity.kt calls ApiClient.clearToken(this) $n times (must be 2: Disconnect + server-rejected). A third one is an automatic logout."
              echo "MainActivity.kt - clearToken call count $n (expected 2)" >> "$REPORT"
              MISSING=1
            fi
          fi
          if [ -f "$SRC/DeviceService.kt" ]; then
            # The revoked branch used to call clearToken(), which is exactly the
            # "logged me out on its own" report: revoking is a dashboard action,
            # and it must pause the device, never erase its token.
            if CODE "$SRC/DeviceService.kt" | sed -n '/status == "revoked"/,/^ *}/p' | grep -q "clearToken"; then
              echo "::error::STALE: DeviceService.kt clears the token on 'revoked'. That is an automatic logout. Re-upload it."
              echo "DeviceService.kt - revoked branch calls clearToken" >> "$REPORT"
              MISSING=1
            fi
            if ! grep -q 'ServiceStatus.markError("revoked from dashboard")' "$SRC/DeviceService.kt"; then
              echo "::error::STALE: DeviceService.kt does not pause cleanly on revocation. Re-upload it."
              echo "DeviceService.kt - revoked branch does not mark the status" >> "$REPORT"
              MISSING=1
            fi
          fi

          # ---- Background services must not start themselves ---------------
          # startService() from the background throws IllegalStateException on
          # Android 8+. Every stop() path here runs from a dashboard request or
          # a revocation, both of which arrive while the app is backgrounded,
          # so they crashed the app instead of stopping capture.
          for svc in ScreenCaptureService CameraLiveService MicLiveService CallRecorderService; do
            if [ -f "$SRC/$svc.kt" ]; then
              if CODE "$SRC/$svc.kt" | sed -n '/fun stop(context/,/^ *}/p' | grep -q "context.startService"; then
                echo "::error::STALE: $svc.stop() uses startService, which throws from the background on Android 8+. Re-upload it."
                echo "$svc.kt - stop() must use stopService()" >> "$REPORT"
                MISSING=1
              fi
            fi
          done

          # ---- Frame uploads must not run on the main thread ---------------
          # CameraLiveService delivered frames on the main looper and posted
          # them over HTTPS from there, which throws
          # NetworkOnMainThreadException and killed the whole live stream on
          # the very first frame.
          need CameraLiveService.kt 'uploadExecutor' 'live camera uploads still run on the main thread (NetworkOnMainThreadException)'
          if [ -f "$SRC/CameraLiveService.kt" ]; then
            if CODE "$SRC/CameraLiveService.kt" | grep -q 'setOnImageAvailableListener({ r ->'; then
              if ! grep -q 'uploadExecutor.execute' "$SRC/CameraLiveService.kt"; then
                echo "::error::STALE: CameraLiveService.kt uploads inside the image listener (main thread). Re-upload it."
                echo "CameraLiveService.kt - frame upload is not off the main thread" >> "$REPORT"
                MISSING=1
              fi
            fi
          fi

          # ---- Live-camera files: these change often, so check them by COUNT,
          # not just by presence. A stale MainActivity.kt fails with dozens of
          # confusing "Overload resolution ambiguity" errors because the same
          # field is declared three times; counting makes that obvious.
          if [ -f "$SRC/MainActivity.kt" ]; then
            n=$(grep -c "private lateinit var switchCameraLive" "$SRC/MainActivity.kt" || true)
            if [ "$n" != "1" ]; then
              echo "::error::STALE: MainActivity.kt declares switchCameraLive $n times (must be 1). Re-upload MainActivity.kt."
              echo "MainActivity.kt - switchCameraLive declared $n times (expected 1)" >> "$REPORT"
              MISSING=1
            fi
            n=$(grep -c "switchCameraLive.setOnCheckedChangeListener" "$SRC/MainActivity.kt" || true)
            if [ "$n" != "1" ]; then
              echo "::error::STALE: MainActivity.kt has $n camera listeners (must be 1). Re-upload MainActivity.kt."
              echo "MainActivity.kt - camera listener count $n (expected 1)" >> "$REPORT"
              MISSING=1
            fi
            # The "connected" block used to repeat these three assignments three
            # times. It still COMPILES (they are idempotent), so a compiler error
            # never caught it - only a count does.
            n=$(grep -c "switchCameraLive.isChecked = CameraLiveService.isArmed(this)" "$SRC/MainActivity.kt" || true)
            if [ "$n" -gt 1 ]; then
              echo "::error::STALE: MainActivity.kt assigns the camera-live switch $n times (duplicated block). Re-upload MainActivity.kt."
              echo "MainActivity.kt - camera-live 'connected' block repeated $n times (expected 1)" >> "$REPORT"
              MISSING=1
            fi
          fi
          if [ -f "$SRC/CameraLiveService.kt" ]; then
            if grep -q "TEMPLATE_STREAMING" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt uses TEMPLATE_STREAMING, which does not exist in the Camera2 API. Re-upload it."
              echo "CameraLiveService.kt - TEMPLATE_STREAMING is not a real Camera2 constant" >> "$REPORT"
              MISSING=1
            fi
            if ! grep -q "CameraDevice.TEMPLATE_PREVIEW" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt missing CameraDevice.TEMPLATE_PREVIEW. Re-upload it."
              echo "CameraLiveService.kt - missing CameraDevice.TEMPLATE_PREVIEW" >> "$REPORT"
              MISSING=1
            fi
            # TEMPLATE_PREVIEW paired with a JPEG ImageReader is what made the
            # live view black: the preview template does not drive the JPEG
            # still-capture pipeline, and the hard-coded 480x640 was usually
            # not even an advertised output size. YUV_420_888 as the preview stream
            # format is the combination that actually delivers frames.
            if ! grep -q "YUV_420_888" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt is not using YUV_420_888 for the preview stream. Re-upload it."
              echo "CameraLiveService.kt - preview stream is not YUV_420_888 (black live view)" >> "$REPORT"
              MISSING=1
            fi
            if ! grep -q "private fun yuvToArgb" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt is missing the YUV->ARGB conversion. Re-upload it."
              echo "CameraLiveService.kt - missing yuvToArgb()" >> "$REPORT"
              MISSING=1
            fi
            # YuvImage/NV_21 do not resolve on this project's Android classpath --
            # CI proved it: even `import android.media.YuvImage` failed to compile.
            # Compression therefore goes through Bitmap, which is known good here.
            if grep -q "YuvImage" "$SRC/CameraLiveService.kt"; then
              if grep -qE '^\s*import android\.media\.YuvImage|YuvImage\(|ImageFormat\.NV_21' "$SRC/CameraLiveService.kt"; then
                echo "::error::STALE: CameraLiveService.kt uses YuvImage / ImageFormat.NV_21, which do not resolve on this classpath (compile error). Re-upload it."
                echo "CameraLiveService.kt - YuvImage/NV_21 are unresolvable here; use Bitmap.compress" >> "$REPORT"
                MISSING=1
              fi
            fi
            if ! grep -q "bmp.compress(Bitmap.CompressFormat.JPEG" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt does not compress through Bitmap. Re-upload it."
              echo "CameraLiveService.kt - missing Bitmap.compress(JPEG)" >> "$REPORT"
              MISSING=1
            fi
            if ! grep -q "pickStreamSize" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt hard-codes the stream size instead of asking the camera. Re-upload it."
              echo "CameraLiveService.kt - missing pickStreamSize()" >> "$REPORT"
              MISSING=1
            fi
          fi
          # One-shot photos: `minByOrNull { w * h }` picks the smallest advertised
          # JPEG, which on many devices is a stub that decodes to a black square.
          if [ -f "$SRC/CameraWorker.kt" ] && CODE "$SRC/CameraWorker.kt" | grep -q "minByOrNull { it.width \* it.height }"; then
            echo "::error::STALE: CameraWorker.kt still picks the smallest JPEG size (black photos). Re-upload it."
            echo "CameraWorker.kt - picks the smallest JPEG instead of pickCaptureSize()" >> "$REPORT"
            MISSING=1
          fi
          need CameraWorker.kt 'private fun pickCaptureSize' 'CameraWorker.kt does not pick a real capture size (black photos)'

          # The Bitmap must be exactly the size the pixel buffer was produced at.
          # Using image.width/height while yuvToArgb() filled from cropRect made
          # the two disagree, and the frame was dropped or came out skewed - a
          # permanently black live view again.
          if [ -f "$SRC/CameraLiveService.kt" ]; then
            if ! grep -q "image.cropRect.width()" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt does not use cropRect dimensions for the JPEG step (black live view). Re-upload it."
              echo "CameraLiveService.kt - toJpeg() does not use cropRect dimensions" >> "$REPORT"
              MISSING=1
            fi
          fi

          # ---- Live microphone (consent-based, owner-armed only) ------------
          need MicLiveService.kt 'fun toWav' 'live microphone clips are not wrapped in a WAV header'
          need MicLiveService.kt 'FOREGROUND_SERVICE_TYPE_MICROPHONE' 'live microphone has no visible consent indicator'
          need MicLiveService.kt 'AudioRecord' 'live microphone does not actually record'
          need MainActivity.kt 'switchMicLive.setOnCheckedChangeListener' 'the phone owner has no switch to arm the live microphone'
          # Manifest registration. This used to be `grep -q 'MicLiveService'`, a bare
          # substring match. That is satisfied by ANY name containing the
          # string - a manifest with `.MicLiveServiceGone`, or the word inside
          # a comment, passed the check while the real service entry was gone,
          # and the app crashed at runtime with an unresolvable class. Verified:
          # that exact mutation slipped past the old check. Now every declared
          # component is matched on its exact android:name attribute, and the
          # mic additionally has to declare its foregroundServiceType (without
          # which Android refuses to start the service).
          MANIFEST=android/app/src/main/AndroidManifest.xml
          declare -A MANIFEST_ATTR=( \
            [BootReceiver]=receiver \
            [DeviceService]=service \
            [CallRecorderService]=service \
            [CameraLiveService]=service \
            [MicLiveService]=service \
            [ScreenCaptureService]=service \
            [NotificationSyncService]=service \
            [MainActivity]=activity \
            [CameraConsentActivity]=activity \
            [ScreenConsentActivity]=activity )
          for comp in "${!MANIFEST_ATTR[@]}"; do
            if [ ! -f "$MANIFEST" ]; then
              echo "::error::MISSING FILE: $MANIFEST is not in the repository."
              MISSING=1
              continue
            fi
            if ! grep -qE "android:name=\"\.${comp}\"" "$MANIFEST"; then
              echo "::error::STALE: $comp has no <${MANIFEST_ATTR[$comp]}> entry with android:name=\".$comp\" in AndroidManifest.xml. Android cannot start or bind it. Re-upload the manifest."
              echo "AndroidManifest.xml - $comp (${MANIFEST_ATTR[$comp]}) entry missing" >> "$REPORT"
              MISSING=1
            fi
          done
          if [ -f "$MANIFEST" ] && ! grep -A3 'android:name="\.MicLiveService"' "$MANIFEST" | grep -q 'foregroundServiceType="microphone"'; then
            echo "::error::STALE: the MicLiveService entry does not declare foregroundServiceType=\"microphone\". Android refuses to start the service without it, so live audio would never start. Re-upload the manifest."
            echo "AndroidManifest.xml - MicLiveService foregroundServiceType missing" >> "$REPORT"
            MISSING=1
          fi
          if [ -f "$MANIFEST" ] && ! grep -A3 'android:name="\.CameraLiveService"' "$MANIFEST" | grep -q 'foregroundServiceType="camera"'; then
            echo "::error::STALE: the CameraLiveService entry does not declare foregroundServiceType=\"camera\". Re-upload the manifest."
            echo "AndroidManifest.xml - CameraLiveService foregroundServiceType missing" >> "$REPORT"
            MISSING=1
          fi

          # ---- Cadence: the owner asked for the dashboard to update every
          # second. Assert the 1-second values, and assert the SECOND poller
          # thread is gone: at a 1s cadence two pollers meant six HTTP calls a
          # second competing with the live camera/mic/screen uploads for the
          # same connection pool, which is how a stream stalls.
          need DeviceService.kt 'private const val TICK_MS = 1_000L' 'heartbeat cadence is not 1 second (dashboard will not update every second)'
          need DeviceService.kt 'private const val COMMAND_POLL_MS = 1_000L' 'command polling is slower than one second, so a dashboard request waits'
          need DeviceService.kt 'private const val DETAIL_EVERY' 'the expensive hardware-detail read is not throttled, so /proc is parsed every second'
          if [ -f "$SRC/DeviceService.kt" ]; then
            if CODE "$SRC/DeviceService.kt" | grep -q "fastCommandLoop"; then
              echo "::error::STALE: DeviceService.kt still runs the second fastCommandLoop poller. At a 1s cadence that is 6 HTTP calls/second and it starves the live streams. Re-upload it."
              echo "DeviceService.kt - fastCommandLoop should be removed; one loop does heartbeat + commands" >> "$REPORT"
              MISSING=1
            fi
            # tick must be advanced exactly once per loop iteration. It used to
            # be incremented at the top AND again inside the approved branch,
            # so every tick counted as two and the bulk sync fired at half the
            # intended interval.
            n=$(grep -c "^\s*tick++" "$SRC/DeviceService.kt" || true)
            if [ "$n" != "1" ]; then
              echo "::error::STALE: DeviceService.kt increments tick $n times (must be 1). Re-upload it."
              echo "DeviceService.kt - tick++ count $n (expected 1)" >> "$REPORT"
              MISSING=1
            fi
          fi

          # ---- Live streams must never build an upload backlog -------------
          # Each frame is a blocking HTTPS POST. Uploading every captured frame
          # queues work faster than the radio can drain it, so the view falls
          # further and further behind and appears to freeze. One upload at a
          # time is what keeps the stream live.
          need ScreenCaptureService.kt 'private val uploading' 'screen share can start a second upload while one is in flight (unbounded backlog)'
          need CameraLiveService.kt 'MIN_FRAME_GAP_MS' 'the live camera uploads every captured frame, so the stream falls behind'
          # A one-second cadence means a partial clip is a very common case;
          # uploading one is an audible click.
          need MicLiveService.kt 'private const val CLIP_SAMPLES = SAMPLE_RATE // 1 second per clip' 'mic clips are not one second (dashboard audio lags)'
          # CHANNEL is the notification channel *id* (a String). AudioRecord needs
          # the integer AudioFormat.CHANNEL_IN_*, so the capture calls must use a
          # separate constant -- conflating the two is a compile error.
          need MicLiveService.kt 'private const val CHANNEL_IN = AudioFormat.CHANNEL_IN_MONO' 'AudioRecord is being fed the String notification channel id instead of a channel-in constant (compile error)'
          need MicLiveService.kt 'AudioRecord.getMinBufferSize(SAMPLE_RATE, CHANNEL_IN, ENCODING)' 'getMinBufferSize is called with the notification channel id'
          if [ -f "$SRC/MicLiveService.kt" ]; then
            if CODE "$SRC/MicLiveService.kt" | grep -q "SAMPLE_RATE \* 2"; then
              echo "::error::STALE: MicLiveService.kt is back to 2-second clips. At a 1s refresh the dashboard audio is always two seconds behind. Re-upload it."
              echo "MicLiveService.kt - clips are 2s instead of 1s" >> "$REPORT"
              MISSING=1
            fi
          fi
          if [ -f "$SRC/ScreenCaptureService.kt" ]; then
            if CODE "$SRC/ScreenCaptureService.kt" | grep -q "coerceIn(400, 5000)"; then
              echo "::error::STALE: ScreenCaptureService.kt still floors the interval at 400ms. Re-upload it."
              echo "ScreenCaptureService.kt - interval floor is back to 400ms" >> "$REPORT"
              MISSING=1
            fi
          fi

          if [ "$STALE" = "1" ] || [ "$MISSING" = "1" ]; then
            {
              echo "### BUILD NOT ATTEMPTED"
              echo '```'
              echo "Exactly these files still need to be replaced:"
              cat "$REPORT"
              echo ""
              echo "Re-upload them from the extracted connectdesk-android.zip"
              echo "(app/, gradle.properties, build.gradle.kts, settings.gradle.kts,"
              echo " BUILD_NOTES.md, README.md) at the repository root."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "sources look current"

      - name: Prepare toolchain, accept licences and build the APK
        run: |
          set -o pipefail
          echo "===== DIAGNOSTIC REPORT ====="
          {
            echo "### Runner"
            echo '```'
            uname -a
            echo '```'
            echo "### Java"
            echo '```'
            java -version 2>&1 || echo "NO JAVA"
            echo '```'
            echo "### JAVA_HOME=$JAVA_HOME"
            echo "### ANDROID_HOME=$ANDROID_HOME"
            echo "### ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "### Gradle"
            echo '```'
            gradle --version 2>&1 || echo "GRADLE NOT ON PATH"
            echo '```'
          } 2>&1 | tee /tmp/diag.txt || true
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY" || true

          # ---- 1. Android SDK location -------------------------------------
          if [ -z "$ANDROID_HOME" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /usr/local/android-sdk; do
              if [ -d "$candidate" ]; then
                echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                echo "ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
                echo "export ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                echo "export ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::warning::sdkmanager not found on PATH, trying known locations"
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android SDK cmdline tools not found - install Android Studio once, or add cmdline-tools to the runner image."
              exit 1
            fi
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          echo "sdkmanager -> $(command -v sdkmanager)"

          # ---- 2. Accept every SDK licence --------------------------------
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --license android-sdk-license > /dev/null 2>&1 || true

          # ---- 3. Install platform + build tools --------------------------
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager --list_installed >> "$GITHUB_STEP_SUMMARY" || true

          # ---- 4. Gradle 8.7 pinned ----------------------------------------
          # The runner ships Gradle 9.x. AGP 8.2.2 cannot run on Gradle 9 (it
          # dies while fingerprinting task inputs), so always install 8.7 and
          # put it first on PATH.
          echo "::notice::Runner Gradle is $(gradle --version 2>/dev/null | awk '/^Gradle /{print $2}') - installing Gradle 8.7"
          curl -fsSL --retry 3 -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "export PATH=/opt/gradle-8.7/bin:$PATH" >> "$GITHUB_ENV"
          export PATH="/opt/gradle-8.7/bin:$PATH"
          hash -r
          echo "gradle binary in use: $(command -v gradle)" >> "$GITHUB_STEP_SUMMARY"
          gradle --version 2>&1 | head -8 >> "$GITHUB_STEP_SUMMARY" || true
          if ! gradle --version 2>/dev/null | grep -q '^Gradle 8\.'; then
            echo "::error::Gradle 8.7 did not take effect - still $(gradle --version 2>/dev/null | awk '/^Gradle /{print $2}')"
            exit 1
          fi

          # ---- 5. Point the build at the SDK ------------------------------
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties >> "$GITHUB_STEP_SUMMARY"

          # ---- 6. Build ---------------------------------------------------
          cd android
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "gradle exit code: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "### COMPILER ERRORS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE "(^|[^a-zA-Z])(e|w): file:|error:|Compilation error|What went wrong|FAILURE:|Execution failed|AAPT:|Unresolved reference|Cannot access|is internal in|None of the following" /tmp/build.log | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### LOG AROUND FIRST FAILURE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk '/FAILED|FAILURE:/{found=NR} {lines[NR]=$0} END{ if(found==0) found=40; start=found-120; if(start<1) start=1; for(i=start;i<=found;i++) print lines[i] }' /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### LAST 60 LOG LINES" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # ---- 7. Locate and publish the APK ------------------------------
          APK="$(find "$GITHUB_WORKSPACE/android" -name '*.apk' -type f 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced. See the build log in the job summary."
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK")
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$APK - $APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp "$APK" "$GITHUB_WORKSPACE/apk-out/connectdesk.apk"
          echo "APK_STAGED_AT=$GITHUB_WORKSPACE/apk-out/connectdesk.apk" >> "$GITHUB_ENV"

      # `assembleDebug` now produces the ISOLATED TEST BUILD (applicationId
      # com.connectdesk.app.debug), so it installs alongside the production
      # app instead of replacing it.
      - name: Upload APK (always runs, even if the build failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectdesk-debug-apk
          path: apk-out/connectdesk.apk
          if-no-files-found: warn

      # Always ship the full Gradle log so a compile failure can be diagnosed
      # from the artifact alone, without scrolling the step log.
      - name: Upload build log (always runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectdesk-build-log
          path: /tmp/build.log
          if-no-files-found: warn
