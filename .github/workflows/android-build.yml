name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

jobs:
  build:
    # 22.04 is the stable image: Android SDK + Gradle preinstalled and it is
    # not affected by the ubuntu-latest -> Ubuntu 26 migration.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Fails fast (and says exactly what to do) when the repo copy of the
      # Kotlin sources is older than the fixed ones. Without this the build
      # just emits five cryptic compiler errors and wastes 90 seconds.
      - name: Verify sources are not stale
        run: |
          set -u
          SRC="android/app/src/main/java/com/connectdesk/app"
          {
            echo "### SOURCE INVENTORY"
            echo '```'
            echo "kotlin files: $(find "$SRC" -name '*.kt' -type f | wc -l)"
            find "$SRC" -name '*.kt' -type f -printf '%f\n' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Strip line comments first: the fixed CallRecorderService.kt still
          # MENTIONS PhoneState inside an explanatory comment, so a naive grep
          # would flag the good file as stale.
          CODE() { sed 's://.*::' "$1" | grep -v '^[[:space:]]*\*' | grep -v '^[[:space:]]*/\*'; }

          STALE=0
          if [ -f "$SRC/CallRecorderService.kt" ] && CODE "$SRC/CallRecorderService.kt" | grep -qE 'android\.telephony\.PhoneState$|android\.telephony\.PhoneState[^L]|CALL_STATE_LISTENER|\.endCall\('; then
            echo "::error::STALE: CallRecorderService.kt is the pre-fix version (PhoneState import / CALL_STATE_LISTENER / endCall)."
            STALE=1
          fi
          if [ -f "$SRC/AppUsageWorker.kt" ] && CODE "$SRC/AppUsageWorker.kt" | grep -qE '\.versionName|\.firstInstallTime|\.moveToNext\('; then
            echo "::error::STALE: AppUsageWorker.kt is the pre-fix version (versionName / firstInstallTime / moveToNext)."
            STALE=1
          fi
          if [ -f "$SRC/CameraWorker.kt" ] && CODE "$SRC/CameraWorker.kt" | grep -qE '=[[:space:]]*camera\.createCaptureSession'; then
            echo "::error::STALE: CameraWorker.kt still assigns createCaptureSession() to a variable."
            STALE=1
          fi
          # ---- Positive checks: the fixed sources MUST contain these tokens.
          # Absence-of-bad-pattern is unreliable, presence-of-good-pattern is
          # not, so assert on the fix itself.
          MISSING=0
          REPORT=/tmp/stale-report.txt
          : > "$REPORT"
          need() { # need <file> <marker> <human label>
            if [ ! -f "$SRC/$1" ]; then
              echo "::error::MISSING FILE: $1 is not in the repository."
              echo "MISSING FILE: $1" >> "$REPORT"
              MISSING=1
            elif ! grep -qF "$2" "$SRC/$1"; then
              echo "::error::STALE: $1 does not contain \"$2\" ($3). Re-upload $1. IF YOUR SOURCE IS CURRENT, THE REAL PROBLEM IS A STALE COPY OF THIS WORKFLOW FILE (.github/workflows/android-build.yml) -- an out-of-date guard calls good code \"old\". Re-upload the workflow too, then re-run."
              echo "STALE: $1 - missing marker: $2" >> "$REPORT"
              MISSING=1
            fi
          }
          # Screen time must be bucketed PER CALENDAR DAY from raw foreground
          # transitions. `queryUsageStats().totalTimeInForeground` is a total
          # over the whole query WINDOW, so using it here stored seven days
          # summed under today's date -- the numbers could never match Digital
          # Wellbeing. If any of these come back, the page is showing a
          # cumulative total wearing a per-day label.
          need AppUsageWorker.kt 'queryEvents(dayStart, dayEnd)' 'app usage is no longer bucketed per day from foreground transitions'
          need AppUsageWorker.kt 'UsageEvents.Event.ACTIVITY_RESUMED' 'app usage no longer counts foreground starts'
          need AppUsageWorker.kt 'UsageEvents.Event.ACTIVITY_PAUSED' 'app usage no longer closes foreground intervals'
          need AppUsageWorker.kt 'bucket.add(pkg, clamp(' 'foreground intervals are not clamped to their own day (midnight sessions double-count)'
          need AppUsageWorker.kt 'out[formatDay(dayStart)] = bucket' 'per-day buckets are never stored (history collapses to one day)'
          # `DataSyncWorker` runs once a MINUTE, so an unthrottled scan would
          # re-walk a week of usage events and re-POST immutable history every
          # minute. Completed days must be remembered and skipped, and the
          # owner's explicit rescan must bypass the throttle.
          need AppUsageWorker.kt 'if (!force && now - lastSyncAt(context) < SYNC_INTERVAL_MS)' 'app usage is scanned every minute with no throttle (battery and data burn)'
          need AppUsageWorker.kt 'if (day != today && day != yesterday && done.contains(day)) continue' 'finished days are re-uploaded on every scan (immutable history resent forever)'
          need AppUsageWorker.kt 'if (sent > 0) setLastSyncAt(context, now)' 'a failed scan still starts the throttle window (offline device would not recover for 30 min)'
          # The owner's explicit "Rescan on device" must bypass the throttle,
          # or the button silently does nothing for up to 30 minutes.
          need CommandWorker.kt 'AppUsageWorker.sync(context, token, force = true)' 'the dashboard rescan button does not bypass the throttle (appears to do nothing)'
          need CallRecorderService.kt 'PhoneStateListener.LISTEN_CALL_STATE' 'fixed call-state bitmask is missing'
          # Call audio. `AudioSource.DEFAULT` is the source A/V capture uses, and
          # while a call is up Android routes the mic to the voice path, so
          # DEFAULT records the MUTED stream: the file uploads, plays for its
          # full duration and says nothing. That was the whole "call recording
          # dikhti hai par awaaz nahi aati" report. VOICE_RECOGNITION is the
          # only public source tuned to coexist with an active call, with MIC
          # as the fallback. `VOICE_CALL`/`VOICE_DOWNLINK` are hidden system
          # APIs and stay out of this on purpose -- the far end is not
          # reachable without them.
          need CallRecorderService.kt 'MediaRecorder.AudioSource.VOICE_RECOGNITION' 'call recording is back on a source that records the muted call stream (playable but silent)'
          need CallRecorderService.kt 'private fun startRecorder(file: File): MediaRecorder?' 'call recording no longer falls back across audio sources, so one wrong source drops the call instead of retrying'
          # A recording the device PROVED it never heard must not be uploaded.
          # Otherwise the dashboard shows a full-length file of silence with no
          # way to tell it apart from a broken player.
          need CallRecorderService.kt 'if (!heardSomething) {' 'a silent call recording is uploaded as if it had audio (dashboard shows a playable nothing)'
          need CallRecorderService.kt 'r.maxAmplitude }.getOrDefault(0)' 'call recording no longer samples its own microphone, so silence cannot be detected (the marker deliberately carries the closing brace, because a bare r.maxAmplitude is a PREFIX and a broken r.maxAmplitudeX still contains it -- the negative suite proved that)'
          if [ -f "$SRC/CallRecorderService.kt" ] && CODE "$SRC/CallRecorderService.kt" | grep -q 'AudioSource\.DEFAULT'; then
            echo "::error::STALE: CallRecorderService.kt records from AudioSource.DEFAULT, which captures the muted call stream on Android. Use VOICE_RECOGNITION (or MIC). Re-upload it."
            echo "CallRecorderService.kt - AudioSource.DEFAULT records silence during a call" >> "$REPORT"
            MISSING=1
          fi
          # The old upload read the whole file with readBytes() and posted it as
          # one base64 blob; a long call (~6.4 MB once encoded) timed out and the
          # recording was lost. `uploadChunk` exists precisely for the slices.
          if [ -f "$SRC/CallRecorderService.kt" ] && grep -q 'file.readBytes()' "$SRC/CallRecorderService.kt"; then
            echo "::error::STALE: CallRecorderService.kt uploads the whole recording in one base64 blob. Long calls then time out and are lost. Re-upload it."
            echo "CallRecorderService.kt - whole-file readBytes() upload instead of chunks" >> "$REPORT"
            MISSING=1
          fi
          need CameraWorker.kt 'val sessionCallback = object : CameraCaptureSession.StateCallback()' 'fixed capture-session callback is missing'
          # FileWorker.kt drives the whole folder tree. Without the root-prefixed
          # walk every top-level folder collapses into one flat list on the
          # dashboard, which reads as "files are broken". Assert on the fix.
          need FileWorker.kt 'walk(dir, dir.name, 0, arr)' 'folder tree walk does not keep the root folder prefix'
          need FileWorker.kt 'put("path", dir.name)' 'root folder itself is not pushed as an entry'
          need FileWorker.kt 'noiseRoots' 'folder walk is still on the old allow-list instead of the noise deny-list'
          if [ -f "$SRC/FileWorker.kt" ] && grep -qF 'walk(dir, "", 0, arr)' "$SRC/FileWorker.kt"; then
            echo "::error::STALE: FileWorker.kt still walks with an empty root prefix. Re-upload it."
            echo "FileWorker.kt - walk(dir, \"\", 0, arr) still present" >> "$REPORT"
            MISSING=1
          fi
          # The buffer inside scanAndSync() is `arr`; `out` used to be the name
          # of walk()'s parameter. Mixing them up compiles nowhere and produced
          # "Unresolved reference: out" - so assert the buffer names are not
          # conflated any more.
          need FileWorker.kt 'arr.put(' 'scanAndSync is not writing the root folder into its own buffer'
          need FileWorker.kt 'sink: JSONArray' 'walk() buffer is not named sink'
          need FileWorker.kt 'walk(child, rel, depth + 1, sink, keepGoing)' 'recursive walk() call still passes the old buffer name'
          # `out` was walk()'s old parameter name. It has to be gone EVERYWHERE -
          # as a receiver, as a lambda argument, as a plain argument. Two CI runs
          # in a row died on it (once in scanAndSync, once in the recursive
          # call), so check the whole file rather than one statement shape.
          if [ -f "$SRC/FileWorker.kt" ] && CODE "$SRC/FileWorker.kt" | grep -qE '\bout\b'; then
            echo "::error::STALE: FileWorker.kt still references \`out\`. The buffers are now \`arr\` (scanAndSync) and \`sink\` (walk). Re-upload it."
            echo "FileWorker.kt - bare identifier 'out' still present (should be arr/sink)" >> "$REPORT"
            MISSING=1
          fi

          # Pairing lives or dies on the device asking the SAME Convex
          # deployment that the dashboard wrote the code to. If valuable-goldfish
          # is not listed FIRST the phone claims against the wrong database and
          # reports "Invalid pairing code" for a perfectly valid code.
          need Backend.kt 'https://valuable-goldfish-43.convex.site' 'the previously-primary deployment is missing from Backend.candidates'
          need Backend.kt 'https://blessed-goat-500.convex.site' 'the deployment `convex dev` actually pushes to (and that serves every current function) is missing from Backend.candidates'
          # The dashboard writes the pairing code on the deployment its build
          # resolves to. Omitting it from the phone is exactly what produced
          # `HTTP 400 Invalid pairing code` for a code created on screen.
          need Backend.kt 'https://cautious-squirrel-266.convex.site' 'the ACTIVE deployment (dev/rahula5540) is missing from Backend.candidates, so the phone asks the old account and every request fails'
          need Backend.kt 'https://notable-snail-502.convex.site' 'the previously-active deployment is missing from Backend.candidates (kept as a fallback)'
          need Backend.kt 'fun rotate(context: Context): Boolean' 'deployment-mismatch recovery (Backend.rotate) is missing'
          if [ -f "$SRC/Backend.kt" ]; then
            # ORDER MATTERS: the pairing code is written to ONE deployment, so
            # the phone must ask that same deployment for it. The project moved
            # to cautious-squirrel-266 (dev/rahula5540) after the previous team
            # hit its free-plan ceiling, so that one must be FIRST here or every
            # request goes to a disabled account.
            order=$(grep -oE 'https://[a-z0-9-]+\.convex\.site' "$SRC/Backend.kt" | head -2 | tr '\n' ' ')
            case "$order" in
              "https://cautious-squirrel-266.convex.site http"* | "https://cautious-squirrel-266.convex.site")
                ;;
              *)
                echo "::error::STALE: Backend.kt lists candidates in the wrong order ($order). cautious-squirrel-266 must be FIRST -- it is the deployment the dashboard creates pairing codes on and pushes to; otherwise the phone asks a stale account and every request fails."
                echo "Backend.kt - candidate order wrong ($order)" >> "$REPORT"
                MISSING=1
                ;;
            esac
          fi
          # Match the expression, not the `if`/`if (!...)` wrapper: the retry walk was
          # extended to loop over every candidate, and a marker that pins the
          # negatin would call the NEW file "old" -- which is exactly the
          # false alarm this guard is supposed to avoid.
          need ApiClient.kt 'reason.contains("Invalid pairing code")' 'claim() no longer retries on the other deployment'
          need ApiClient.kt '.url("$url/api/device/status")' 'probe is not asserting on our own response shape'

          # ---- No automatic logout ------------------------------------------
          # MainActivity used to treat a NULL status response as "logged out".
          # A null response is what you get for no signal, a timeout, a 5xx or
          # a paused backend, so the phone silently threw the user back to the
          # sign-in form and lost the pairing without anyone doing anything.
          # The fix separates the three cases, and these markers make sure the
          # separated version is what gets compiled.
          need ApiClient.kt 'sealed class StatusResult' 'status can no longer distinguish "unknown token" from "could not reach the server"'
          need ApiClient.kt 'object Rejected' 'a rejected token is not distinguishable from an outage'
          need ApiClient.kt 'object Unreachable' 'an unreachable server is treated as a logout'
          need ApiClient.kt 'var lastErrorWasNetwork: Boolean' 'post() no longer records whether the failure was a network failure'
          need ApiClient.kt 'fun relocateForToken' 'deployment rotation is not distinguished from a real logout'
          need MainActivity.kt 'private fun showUnreachable' 'an outage still sends the user back to the login screen'
          need MainActivity.kt 'is ApiClient.StatusResult.Unreachable ->' 'refreshUi() does not branch on an unreachable server'
          need MainActivity.kt 'private fun showRevoked' 'a server-side revoke wipes the pairing instead of pausing it'
          # clearToken must appear EXACTLY TWICE: once in disconnect() (the
          # user pressing Disconnect) and once in the branch where every
          # deployment rejected the token. Any third call site is a silent
          # logout that no one asked for.
          if [ -f "$SRC/MainActivity.kt" ]; then
            # `grep -c` counts LINES, so two calls on one line would slip past.
            # Count occurrences instead.
            n=$(grep -o "ApiClient\.clearToken(this)" "$SRC/MainActivity.kt" | wc -l | tr -d ' ')
            if [ "$n" != "2" ]; then
              echo "::error::STALE: MainActivity.kt calls ApiClient.clearToken(this) $n times (must be 2: Disconnect + server-rejected). A third one is an automatic logout."
              echo "MainActivity.kt - clearToken call count $n (expected 2)" >> "$REPORT"
              MISSING=1
            fi
          fi
          if [ -f "$SRC/DeviceService.kt" ]; then
            # The revoked branch used to call clearToken(), which is exactly the
            # "logged me out on its own" report: revoking is a dashboard action,
            # and it must pause the device, never erase its token.
            if CODE "$SRC/DeviceService.kt" | sed -n '/status == "revoked"/,/^ *}/p' | grep -q "clearToken"; then
              echo "::error::STALE: DeviceService.kt clears the token on 'revoked'. That is an automatic logout. Re-upload it."
              echo "DeviceService.kt - revoked branch calls clearToken" >> "$REPORT"
              MISSING=1
            fi
            if ! grep -q 'ServiceStatus.markError("revoked from dashboard")' "$SRC/DeviceService.kt"; then
              echo "::error::STALE: DeviceService.kt does not pause cleanly on revocation. Re-upload it."
              echo "DeviceService.kt - revoked branch does not mark the status" >> "$REPORT"
              MISSING=1
            fi
          fi

          # ---- Background services must not start themselves ----------------
          # startService() from the background throws IllegalStateException on
          # Android 8+. Every stop() path here runs from a dashboard request or
          # a revocation, both of which arrive while the app is backgrounded,
          # so they crashed the app instead of stopping capture.
          for svc in ScreenCaptureService CameraLiveService MicLiveService CallRecorderService; do
            if [ -f "$SRC/$svc.kt" ]; then
              if CODE "$SRC/$svc.kt" | sed -n '/fun stop(context/,/^ *}/p' | grep -q "context.startService"; then
                echo "::error::STALE: $svc.stop() uses startService, which throws from the background on Android 8+. Re-upload it."
                echo "$svc.kt - stop() must use stopService()" >> "$REPORT"
                MISSING=1
              fi
            fi
          done

          # ---- Frame uploads must not run on the main thread ----------------
          # CameraLiveService delivered frames on the main looper and posted
          # them over HTTPS from there, which throws
          # NetworkOnMainThreadException and killed the whole live stream on
          # the very first frame.
          need CameraLiveService.kt 'uploadExecutor' 'live camera uploads still run on the main thread (NetworkOnMainThreadException)'
          if [ -f "$SRC/CameraLiveService.kt" ]; then
            if CODE "$SRC/CameraLiveService.kt" | grep -q 'setOnImageAvailableListener({ r ->'; then
              if ! grep -q 'uploadExecutor.execute' "$SRC/CameraLiveService.kt"; then
                echo "::error::STALE: CameraLiveService.kt uploads inside the image listener (main thread). Re-upload it."
                echo "CameraLiveService.kt - frame upload is not off the main thread" >> "$REPORT"
                MISSING=1
              fi
            fi
          fi

          # ---- Live-camera files: these change often, so check them by COUNT,
          # not just by presence. A stale MainActivity.kt fails with dozens of
          # confusing "Overload resolution ambiguity" errors because the same
          # field is declared three times; counting makes that obvious.
          if [ -f "$SRC/MainActivity.kt" ]; then
            n=$(grep -c "private lateinit var switchCameraLive" "$SRC/MainActivity.kt" || true)
            if [ "$n" != "1" ]; then
              echo "::error::STALE: MainActivity.kt declares switchCameraLive $n times (must be 1). Re-upload MainActivity.kt."
              echo "MainActivity.kt - switchCameraLive declared $n times (expected 1)" >> "$REPORT"
              MISSING=1
            fi
            n=$(grep -c "switchCameraLive.setOnCheckedChangeListener" "$SRC/MainActivity.kt" || true)
            if [ "$n" != "1" ]; then
              echo "::error::STALE: MainActivity.kt has $n camera listeners (must be 1). Re-upload MainActivity.kt."
              echo "MainActivity.kt - camera listener count $n (expected 1)" >> "$REPORT"
              MISSING=1
            fi
            # The "connected" block used to repeat these three assignments three
            # times. It still COMPILES (they are idempotent), so a compiler error
            # never caught it - only a count does.
            n=$(grep -c "switchCameraLive.isChecked = CameraLiveService.isArmed(this)" "$SRC/MainActivity.kt" || true)
            if [ "$n" -gt 1 ]; then
              echo "::error::STALE: MainActivity.kt assigns the camera-live switch $n times (duplicated block). Re-upload MainActivity.kt."
              echo "MainActivity.kt - camera-live 'connected' block repeated $n times (expected 1)" >> "$REPORT"
              MISSING=1
            fi
          fi
          if [ -f "$SRC/CameraLiveService.kt" ]; then
            if grep -q "TEMPLATE_STREAMING" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt uses TEMPLATE_STREAMING, which does not exist in the Camera2 API. Re-upload it."
              echo "CameraLiveService.kt - TEMPLATE_STREAMING is not a real Camera2 constant" >> "$REPORT"
              MISSING=1
            fi
            if ! grep -q "CameraDevice.TEMPLATE_PREVIEW" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt missing CameraDevice.TEMPLATE_PREVIEW. Re-upload it."
              echo "CameraLiveService.kt - missing CameraDevice.TEMPLATE_PREVIEW" >> "$REPORT"
              MISSING=1
            fi
            # TEMPLATE_PREVIEW paired with a JPEG ImageReader is what made the
            # live view black: the preview template does not drive the JPEG
            # still-capture pipeline, and the hard-coded 480x640 was usually
            # not even an advertised output size. YUV_420_888 as the preview stream
            # format is the combination that actually delivers frames.
            if ! grep -q "YUV_420_888" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt is not using YUV_420_888 for the preview stream. Re-upload it."
              echo "CameraLiveService.kt - preview stream is not YUV_420_888 (black live view)" >> "$REPORT"
              MISSING=1
            fi
            if ! grep -q "private fun yuvToArgb" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt is missing the YUV->ARGB conversion. Re-upload it."
              echo "CameraLiveService.kt - missing yuvToArgb()" >> "$REPORT"
              MISSING=1
            fi
            # YuvImage/NV_21 do not resolve on this project's Android classpath --
            # CI proved it: even `import android.media.YuvImage` failed to compile.
            # Compression therefore goes through Bitmap, which is known good here.
            if grep -q "YuvImage" "$SRC/CameraLiveService.kt"; then
              if grep -qE '^\s*import android\.media\.YuvImage|YuvImage\(|ImageFormat\.NV_21' "$SRC/CameraLiveService.kt"; then
                echo "::error::STALE: CameraLiveService.kt uses YuvImage / ImageFormat.NV_21, which do not resolve on this classpath (compile error). Re-upload it."
                echo "CameraLiveService.kt - YuvImage/NV_21 are unresolvable here; use Bitmap.compress" >> "$REPORT"
                MISSING=1
              fi
            fi
            if ! grep -q "bmp.compress(Bitmap.CompressFormat.JPEG" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt does not compress through Bitmap. Re-upload it."
              echo "CameraLiveService.kt - missing Bitmap.compress(JPEG)" >> "$REPORT"
              MISSING=1
            fi
            if ! grep -q "pickStreamSize" "$SRC/CameraLiveService.kt"; then
              echo "::error::STALE: CameraLiveService.kt hardcodes the stream size instead of asking the camera. Re-upload it."
              echo "CameraLiveService.kt - missing pickStreamSize()" >> "$REPORT"
              MISSING=1
            fi
          fi
          # One-shot photos: `minByOrNull { w * h }` picks the smallest advertised
          # JPEG, which on many devices is a stub that decodes to a black square.
          if [ -f "$SRC/CameraWorker.kt" ] && CODE "$SRC/CameraWorker.kt" | grep -q "minByOrNull { it.width \* it.height }"; then
            echo "::error::STALE: CameraWorker.kt still picks the smallest JPEG size (black photos). Re-upload it."
            echo "CameraWorker.kt - picks the smallest JPEG instead of pickCaptureSize()" >> "$REPORT"
            MISSING=1
          fi
          need CameraWorker.kt 'private fun pickCaptureSize' 'CameraWorker.kt does not pick a real capture size (black photos)'

          # ImageReader.newInstance call shape. The old version passed 2 for
          # maxImages, which left no headroom while a frame was being encoded and
          # the reader overflowed, killing the whole live stream. The fix uses 3,
          # and the assertion checks the full call shape as one whole call
          # instead of being truncated at the inner paren.
          #
          # This used to be an awk state machine. awk rejected the program
          # outright (`awk: 1: unexpected character '\`) and the pipeline
          # produced nothing, so `bufs` came back EMPTY for every source --
          # the correct one included -- and this check reported STALE on
          # good code. The first CI run failed on the FIXED file for exactly
          # that reason. A guard that can never report success is not a
          # guard; it is a wall.
          bufs=$(CODE "$SRC/CameraLiveService.kt" \
            | tr '\n' ' ' \
            | grep -oE 'ImageReader\.newInstance\(([^)]*|[^()])*\)' \
            | grep -oE '[0-9]+' | tail -1)
          if [ "$bufs" != "3" ]; then
            echo "::error::STALE: CameraLiveService.kt ImageReader maxImages is '${bufs:-none}' (must be 3). Two leaves no headroom while a frame is being encoded and the reader overflows, killing the app. Re-upload it."
            echo "CameraLiveService.kt - ImageReader maxImages = ${bufs:-none} (expected 3)" >> "$REPORT"
            MISSING=1
          fi

          # ---- Screen share: consent is reused, not re-asked --------------
          # Android raises the MediaProjection dialog on every
          # createScreenCaptureIntent(), so asking per dashboard click is the
          # platform default. The fix parks the granted MediaProjection and
          # reuses it. `projection.stop()` in onDestroy is what BURNS that
          # consent, so its return is the regression that brings the dialog
          # back -- and it is easy to "tidy up" by accident.
          need ScreenCaptureService.kt 'val canReuseConsent' 'the parked MediaProjection / canReuseConsent path is gone, so consent is re-asked on every view'
          need ScreenConsentActivity.kt 'ScreenCaptureService.startWithStoredConsent' 'ScreenConsentActivity always shows the dialog instead of reusing stored consent'
          if [ -f "$SRC/ScreenCaptureService.kt" ]; then
            if CODE "$SRC/ScreenCaptureService.kt" | sed -n '/override fun onDestroy/,/^    }/p' | grep -q 'projection?.stop()'; then
              echo "::error::STALE: ScreenCaptureService.onDestroy stops the MediaProjection again, which invalidates the stored consent and brings back the dialog on every view. Re-upload it."
              echo "ScreenCaptureService.kt - onDestroy calls projection?.stop()" >> "$REPORT"
              MISSING=1
            fi
          fi

          # ---- A photo is a notification, not a prompt ----------------------
          # The CAMERA permission is granted once, during setup. capturePhoto
          # therefore always notifies and then captures directly, with the
          # tap-to-allow prompt kept only as a fallback for the case where the
          # OS refuses a camera open with no visible activity.
          need MainActivity.kt 'var isInForeground: Boolean = false' 'MainActivity no longer publishes whether it is visible'

          # ---- The dashboard may ASK for camera/mic; it may not START them ---
          # A stream only ever begins in one of two ways, and BOTH are gated on
          # something the phone owner already did:
          #
          #   1. the owner has armed that stream in the app before, in which
          #      case a dashboard ON restarts it directly (no tap, by design);
          #   2. they have not, in which case askOwnerOnDevice posts a
          #      notification and the owner decides.
          #
          # So the invariant is a PAIRING, not a bare absence of `.start(`:
          # every start must be matched by an isArmed gate. An earlier version
          # of this check simply forbade `.start(` in the function, which
          # rejected the correct code -- the owner's own prior consent IS a
          # legitimate gate. Counting both sides keeps the real property
          # enforced and catches an ungated start being added.
          need CommandWorker.kt 'private fun requestLiveStream' 'the dashboard request handler is gone'
          need CommandWorker.kt 'private fun askOwnerOnDevice' 'the "ask the owner on device" prompt is gone, so ON would start capture silently'
          if [ -f "$SRC/CommandWorker.kt" ]; then
            live=$(CODE "$SRC/CommandWorker.kt" \
              | sed -n '/private fun requestLiveStream/,/^    private fun askOwnerOnDevice/p')
            starts=$(printf '%s\n' "$live" | grep -cE '(CameraLiveService|MicLiveService)\.start\(' || true)
            gates=$(printf '%s\n' "$live" | grep -cE '(CameraLiveService|MicLiveService)\.isArmed\(' || true)
            if [ "$starts" -eq 0 ]; then
              echo "::error::STALE: requestLiveStream never starts a stream. It must start directly when the owner already armed it. Re-upload it."
              echo "CommandWorker.kt - requestLiveStream has no start call" >> "$REPORT"
              MISSING=1
            elif [ "$starts" != "$gates" ]; then
              echo "::error::STALE: requestLiveStream has $starts start call(s) but only $gates isArmed gate(s). Every start must be gated on the phone owner's own prior consent, or it is a remote microphone. Re-upload it."
              echo "CommandWorker.kt - requestLiveStream starts=$starts gates=$gates (must be equal)" >> "$REPORT"
              MISSING=1
            fi
          fi

          # ---- Screen share must not need a tap once consent exists --------
          # The consent is granted once. After that, startScreen must reuse the
          # parked MediaProjection and start the VirtualDisplay straight from
          # this foreground service. Falling through to the notification +
          # ScreenConsentActivity path every time is what made every dashboard
          # "View screen" ask for a tap it did not need.
          need CommandWorker.kt 'ScreenCaptureService.startWithStoredConsent(context, width, intervalMs)' 'startScreen does not take the no-tap fast path, so every view still needs a tap'
          need CommandWorker.kt 'postShareNotice(context)' 'the no-tap screen-share path starts without telling the owner it began'

          # ---- The requested lens must reach the device ---------------------
          # A server-side default silently hands back the BACK camera when the
          # owner asked for the front one, which is exactly how "live front
          # camera" reads as broken. The facing is carried in the payload.
          need CommandWorker.kt 'payload.optString("facing", "back")' 'the live-camera request no longer reads the requested lens'
          need CameraLiveService.kt 'setArmedFacing(context, facing)' 'the lens is no longer remembered, so every restart falls back to the back camera'

          # ---- Permissions are asked ONCE, at setup, and never again ---------
          # The complaint this replaces: flipping live camera asked for CAMERA,
          # flipping live mic asked for RECORD_AUDIO, arming call recording
          # asked for RECORD_AUDIO and READ_PHONE_STATE -- so the same
          # permission could be demanded twice, from two screens, forever.
          #
          # The invariant is a COUNT, not a marker: PermissionSetup.kt must be
          # the only file in the client that calls requestPermissions at all.
          # A marker check would pass while a second call site was added next to
          # it, which is the exact regression being guarded.
          need PermissionSetup.kt 'fun allRuntimePermissions()' 'the one-time permission batch is gone'
          need PermissionSetup.kt 'fun runOnce(activity: Activity): Boolean' 'the one-shot guard around the permission batch is gone, so prompts can reappear on every launch'
          if [ -f "$SRC/PermissionSetup.kt" ]; then
            # Count real calls, ignoring comments.
            #
            # The pattern is deliberately UNANCHORED (`requestPermissions(`,
            # no leading dot). The previous version required a `.` before it,
            # which only matched the `activity.requestPermissions(` form inside
            # PermissionSetup itself and let the ordinary bare
            # `requestPermissions(...)` call -- which is exactly how an Activity
            # calls it, and how the feature switches used to -- walk straight
            # through. The negative suite caught that too.
            n=$(CODE "$SRC/PermissionSetup.kt" | grep -c 'requestPermissions(' || true)
            if [ "$n" != "1" ]; then
              echo "::error::STALE: PermissionSetup.kt makes $n requestPermissions call(s); it must be exactly 1 (the single setup batch). Re-upload it."
              echo "PermissionSetup.kt - requestPermissions call count = $n (expected 1)" >> "$REPORT"
              MISSING=1
            fi
          else
            echo "::error::STALE: PermissionSetup.kt is missing entirely. Permissions must be collected once, in one batch. Re-upload it."
            echo "PermissionSetup.kt - file missing" >> "$REPORT"
            MISSING=1
          fi
          # No OTHER file may ask for a runtime permission.
          others=0
          for f in "$SRC"/*.kt; do
            case "$(basename "$f")" in
              PermissionSetup.kt) continue ;;
            esac
            c=$(CODE "$f" | grep -c 'requestPermissions(' || true)
            others=$((others + c))
          done
          if [ "$others" != "0" ]; then
            echo "::error::STALE: $others requestPermissions call(s) outside PermissionSetup.kt. Permissions are collected once at setup; a feature screen must never prompt. Re-upload it."
            echo "Other files - requestPermissions call count = $others (expected 0)" >> "$REPORT"
            MISSING=1
          fi

          # ---- A photo is a notification, not a prompt ----------------------
          # capturePhoto always notifies, then captures directly. The
          # tap-to-allow prompt survives only as a fallback for the case where
          # the OS refuses a camera open with no visible activity, so the
          # direct call must still be the primary path.
          need CommandWorker.kt 'postPhotoNotice(context, facing)' 'the per-capture "photo is being taken" notification is gone'
          # ---- Kotlin syntax the compiler rejected on the first real build ---
          # VOLUME_EXTERNAL is a constant on MediaStore. It is NOT on
          # Environment, so `Environment.VOLUME_EXTERNAL` does not resolve.
          need CommandWorker.kt 'android.provider.MediaStore.VOLUME_EXTERNAL' 'the per-volume media URIs are not built from MediaStore.VOLUME_EXTERNAL (compile error)'
          # ---- Media downloads must open the EXACT row the dashboard listed.
          # A display name is NOT unique: `IMG_20240115_101530.jpg` lives in
          # DCIM *and* in the WhatsApp folder on the same phone. The old lookup
          # tried the name-only clause FIRST and returned on the first hit, so
          # it regularly picked the wrong file -- "download does nothing" or
          # the wrong photo. The index now carries the MediaStore `_id` and the
          # row is opened directly; the name search is only the fallback.
          need CommandWorker.kt 'private fun exactMediaUri(context: Context, collection: String, storeId: Long)' 'the exact MediaStore lookup is gone, so same-named files are matched by name alone again (wrong file / no file)'
          need CommandWorker.kt 'val bases: List<Uri> = if (Build.VERSION.SDK_INT >= 29)' 'the exact lookup calls getContentUri(int) unconditionally, which does not exist below API 29 (NoSuchMethodError at runtime)'
          need DataSyncWorker.kt '.put("storeId", c.getLong(0))' 'the media index no longer reports the MediaStore row id, so a download cannot open the exact file'
          need DataSyncWorker.kt '.put("collection", collection)' 'the media index no longer says which collection a row came from'
          if [ -f "$SRC/CommandWorker.kt" ] && CODE "$SRC/CommandWorker.kt" | grep -q 'Environment\.VOLUME_EXTERNAL'; then
            echo "::error::STALE: CommandWorker.kt reads VOLUME_EXTERNAL off Environment. It is a MediaStore constant. Re-upload it."
            echo "CommandWorker.kt - Environment.VOLUME_EXTERNAL" >> "$REPORT"
            MISSING=1
          fi
          # Kotlin has NO destructuring declarations. `for ((a, (b, c)) in ...)` 
          # and `for ((clause, args) in attempts)` are not valid syntax -- and
          # because the loop header failed to parse, every name declared in it
          # then reported as "Unresolved reference", turning one mistake into a
          # dozen misleading errors. Assert the index-based form.
          need CommandWorker.kt 'for (entry in collections)' 'the media lookup is back to a nested for-destructuring (no such syntax in Kotlin)'
          need CommandWorker.kt 'for (attempt in attempts)' 'the media lookup attempts are back to a for-destructuring of Pair (no such syntax in Kotlin)'
          # `const` is legal only at top level, in a named object or in a
          # companion object. These two caps live in a plain class body.
          need NotificationSyncService.kt 'private val PENDING_MAX = 100' 'the notification queue cap is `const` in a class body (compile error)'
          need NotificationSyncService.kt 'private val PENDING_CHATS_MAX = 200' 'the chat queue cap is `const` in a class body (compile error)'
          if [ -f "$SRC/CommandWorker.kt" ]; then
            if ! CODE "$SRC/CommandWorker.kt" \
              | sed -n '/private fun capturePhoto/,/^    private fun postTapToAllow/p' \
              | grep -q 'CameraWorker.capture(context, token, facing)'; then
              echo "::error::STALE: capturePhoto no longer captures directly, so every photo needs a tap again. Re-upload it."
              echo "CommandWorker.kt - capturePhoto lost the direct capture path" >> "$REPORT"
              MISSING=1
            fi
          fi

          if [ "$STALE" = "1" ] || [ "$MISSING" = "1" ]; then
            {
              echo "### BUILD NOT ATTEMPTED"
              echo '```'
              echo "Exactly these files still need to be replaced:"
              cat "$REPORT"
              echo ""
              echo "Re-upload them from the extracted connectdesk-android.zip"
              echo "(app/, gradle.properties, build.gradle.kts, settings.gradle.kts,"
              echo " BUILD_NOTES.md, README.md) at the repository root."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "sources look current"

      - name: Prepare toolchain, accept licences and build the APK
        run: |
          set -o pipefail
          echo "===== DIAGNOSTIC REPORT ====="
          {
            echo "### Runner"
            echo '```'
            uname -a
            echo '```'
            echo "### Java"
            echo '```'
            java -version 2>&1 || echo "NO JAVA"
            echo '```'
            echo "### JAVA_HOME=$JAVA_HOME"
            echo "### ANDROID_HOME=$ANDROID_HOME"
            echo "### ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "### Gradle (default on PATH)"
            echo '```'
            gradle --version 2>&1 || echo "GRADLE NOT ON PATH"
            echo '```'
          } 2>&1 | tee /tmp/diag.txt || true
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY" || true

          # ---- 1. Android SDK location --------------------------------------
          if [ -z "$ANDROID_HOME" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /usr/local/android-sdk; do
              if [ -d "$candidate" ]; then
                echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                echo "ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
                echo "export ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                echo "export ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::warning::sdkmanager not found on PATH, trying known locations"
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android SDK cmdline tools not found - install Android Studio once, or add cmdline-tools to the runner image."
              exit 1
            fi
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          echo "sdkmanager -> $(command -v sdkmanager)"

          # ---- 2. Accept every SDK licence ----------------------------------
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --license android-sdk-license > /dev/null 2>&1 || true

          # ---- 3. Install platform + build tools ---------------------------
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager --list_installed >> "$GITHUB_STEP_SUMMARY" || true

          # ---- 4. Gradle 8.x ------------------------------------------------
          # AGP 8.2.2 cannot run on Gradle 9: it dies while fingerprinting task
          # inputs. The runner ships Gradle 9.8.0, so a Gradle 8.x has to be
          # resolved somehow.
          #
          # The repo carries NO gradle wrapper (no gradlew, no gradle/wrapper),
          # so nothing in the checkout pins a version -- the workflow has to.
          #
          # This step USED TO download Gradle 8.7 from services.gradle.org and
          # that download is exactly where the job died, with no diagnostics
          # captured, so the run only said "exit code 11" and left nothing to
          # go on. Two changes fix that:
          #   1. Prefer a Gradle 8.x ALREADY on the runner image
          #      (/opt/hostedtoolcache/gradle). No network, no unzip, no
          #      permission problems -- and it is the same reason the 9.8.0
          #      above was found in the first place.
          #   2. Download only as a fallback, into $HOME (no sudo), and put
          #      curl's own stderr into the job summary so a future failure
          #      says WHY instead of a bare exit code.
          echo "### GRADLE CANDIDATES" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo "\$ ls /opt/hostedtoolcache/gradle/"
            ls -1 /opt/hostedtoolcache/gradle/ 2>&1 || echo "(no hostedtoolcache/gradle)"
            echo "\$ ls \$HOME/.gradle/wrapper/dists"
            ls -1 "$HOME/.gradle/wrapper/dists" 2>&1 || echo "(no wrapper dists)"
            echo "\$ command -v gradle"
            command -v gradle || echo "(gradle not on PATH)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          GRADLE_BIN=""
          GRADLE_VER=""
          for dir in $(ls -1d /opt/hostedtoolcache/gradle/*/ 2>/dev/null | sort -V -r); do
            for d in "${dir}x64/bin/gradle" "${dir}bin/gradle"; do
              [ -x "$d" ] || continue
              v=$("$d" --version 2>/dev/null | awk '/^Gradle /{print $2}' || true)
              case "$v" in
                8.*)
                  GRADLE_BIN="$d"
                  GRADLE_VER="$v"
                  break
                  ;;
              esac
            done
            if [ -n "$GRADLE_BIN" ]; then break; fi
          done

          if [ -n "$GRADLE_BIN" ]; then
            echo "::notice::Using Gradle $GRADLE_VER already installed on the runner at $GRADLE_BIN"
          else
            echo "::notice::No Gradle 8.x on the runner; downloading Gradle 8.7"
            GRADLE_URL="https://services.gradle.org/distributions/gradle-8.7-bin.zip"
            if ! curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 \
                 -o "$HOME/gradle-8.7-bin.zip" "$GRADLE_URL" \
                 >> "$GITHUB_STEP_SUMMARY" 2>&1; then
              echo "::error::Could not download Gradle 8.7 from $GRADLE_URL. AGP 8.2.2 cannot run on the runner's Gradle 9.8.0, so there is no build. curl's own output is in this job summary."
              exit 1
            fi
            unzip -q -o "$HOME/gradle-8.7-bin.zip" -d "$HOME" >> "$GITHUB_STEP_SUMMARY" 2>&1 || {
              echo "::error::Downloaded $GRADLE_URL but could not unzip it. See this job summary."
              exit 1
            }
            GRADLE_BIN="$HOME/gradle-8.7/bin/gradle"
            GRADLE_VER="8.7"
            chmod +x "$GRADLE_BIN" || true
          fi

          echo "gradle binary in use: $GRADLE_BIN ($GRADLE_VER)" >> "$GITHUB_STEP_SUMMARY"
          "$GRADLE_BIN" --version 2>&1 | head -10 >> "$GITHUB_STEP_SUMMARY" || true
          if ! "$GRADLE_BIN" --version 2>/dev/null | grep -q '^Gradle 8\.'; then
            echo "::error::Resolved Gradle is not 8.x (binary: $GRADLE_BIN). AGP 8.2.2 will not run on it."
            exit 1
          fi

          # ---- 5. Point the build at the SDK -------------------------------
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties >> "$GITHUB_STEP_SUMMARY"

          # ---- 6. Build ----------------------------------------------------
          cd android
          set +e
          "$GRADLE_BIN" assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "gradle exit code: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ne 0 ]; then
            # Fail the step so the run is honestly marked red. The artifact
            # steps below are `if: always()`, so the build log and any partial
            # APK are still uploaded for diagnosis.
            echo "::error::assembleDebug failed (exit $STATUS). Compiler errors, if any, are in this job summary under COMPILER ERRORS, and the full log is in the connectdesk-build-log artifact."
          fi
          echo "### COMPILER ERRORS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE "(^|[^a-zA-Z])(e|w): file:|error:|Compilation error|What went wrong|FAILURE:|Execution failed|AAPT:|Unresolved reference|Cannot access|is internal in|None of the following" /tmp/build.log | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### LOG AROUND FIRST FAILURE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk '/FAILED|FAILURE:/{found=NR} {lines[NR]=$0} END{ if(found==0) found=40; start=found-120; if(start<1) start=1; for(i=start;i<=found;i++) print lines[i] }' /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### LAST 60 LOG LINES" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # ---- 7. Locate and publish the APK -------------------------------
          APK="$(find "$GITHUB_WORKSPACE/android" -name '*.apk' -type f 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced. See the build log in the job summary."
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK")
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$APK - $APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp "$APK" "$GITHUB_WORKSPACE/apk-out/connectdesk.apk"
          echo "APK_STAGED_AT=$GITHUB_WORKSPACE/apk-out/connectdesk.apk" >> "$GITHUB_ENV"
          # Only now is the job genuinely successful.
          exit "$STATUS"

      # `assembleDebug` now produces the ISOLATED TEST BUILD (applicationId
      # com.connectdesk.app.debug), so it installs alongside the production
      # app instead of replacing it.
      - name: Upload APK (always runs, even if the build failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectdesk-debug-apk
          path: apk-out/connectdesk.apk
          if-no-files-found: warn

      # Always ship the full Gradle log so a compile failure can be diagnosed
      # from the artifact alone, without scrolling the step log.
      - name: Upload build log (always runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectdesk-build-log
          path: /tmp/build.log
          if-no-files-found: warn
