name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify sources are not stale
        run: |
          set -u
          SRC="android/app/src/main/java/com/connectdesk/app"
          {
            echo "### SOURCE INVENTORY"
            echo '```'
            echo "kotlin files: $(find "$SRC" -name '*.kt' -type f | wc -l)"
            find "$SRC" -name '*.kt' -type f -printf '%f\n' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          CODE() { sed 's://.*::' "$1" | grep -v '^[[:space:]]*\*' | grep -v '^[[:space:]]*/\*'; }

          STALE=0
          if [ -f "$SRC/CallRecorderService.kt" ] && CODE "$SRC/CallRecorderService.kt" | grep -qE 'android\.telephony\.PhoneState$|android\.telephony\.PhoneState[^L]|CALL_STATE_LISTENER|\.endCall\('; then
            echo "::error::STALE: CallRecorderService.kt is the pre-fix version."
            STALE=1
          fi
          if [ -f "$SRC/AppUsageWorker.kt" ] && CODE "$SRC/AppUsageWorker.kt" | grep -qE '\.versionName|\.firstInstallTime|\.moveToNext\('; then
            echo "::error::STALE: AppUsageWorker.kt is the pre-fix version."
            STALE=1
          fi
          if [ -f "$SRC/CameraWorker.kt" ] && CODE "$SRC/CameraWorker.kt" | grep -qE '=[[:space:]]*camera\.createCaptureSession'; then
            echo "::error::STALE: CameraWorker.kt is the pre-fix version."
            STALE=1
          fi

          MISSING=0
          need() {
            if [ ! -f "$SRC/$1" ]; then
              echo "::error::MISSING FILE: $1 is not in the repository."
              MISSING=1
            elif ! grep -qF "$2" "$SRC/$1"; then
              echo "::error::STALE: $1 does not contain the fix marker."
              MISSING=1
            fi
          }
          need AppUsageWorker.kt 'val rows: List<UsageStats>'
          need AppUsageWorker.kt 'for (us in rows)'
          need CallRecorderService.kt 'PhoneStateListener.LISTEN_CALL_STATE'
          need CameraWorker.kt 'val sessionCallback = object : CameraCaptureSession.StateCallback()'

          if [ "$STALE" = "1" ] || [ "$MISSING" = "1" ]; then
            {
              echo "### BUILD NOT ATTEMPTED"
              echo '```'
              echo "The android/ folder in this repository is an OLD copy."
              echo "Re-upload the file(s) named in the errors above."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "sources look current"

      - name: Prepare toolchain, accept licences and build the APK
        run: |
          set -o pipefail
          echo "===== DIAGNOSTIC REPORT ====="
          {
            echo "### Runner"
            echo '```'
            uname -a
            echo '```'
            echo "### Java"
            echo '```'
            java -version 2>&1 || echo "NO JAVA"
            echo '```'
            echo "### JAVA_HOME=$JAVA_HOME"
            echo "### ANDROID_HOME=$ANDROID_HOME"
            echo "### ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "### Gradle"
            echo '```'
            gradle --version 2>&1 || echo "GRADLE NOT ON PATH"
            echo '```'
          } 2>&1 | tee /tmp/diag.txt || true
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY" || true

          # ---- 1. Android SDK location -------------------------------------
          if [ -z "$ANDROID_HOME" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /usr/local/android-sdk; do
              if [ -d "$candidate" ]; then
                echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                echo "ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
                echo "export ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                echo "export ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::warning::sdkmanager not found on PATH, trying known locations"
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android SDK cmdline tools not found."
              exit 1
            fi
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          echo "sdkmanager -> $(command -v sdkmanager)"

          # ---- 2. Accept every SDK licence --------------------------------
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --license android-sdk-license > /dev/null 2>&1 || true

          # ---- 3. Install platform + build tools --------------------------
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager --list_installed >> "$GITHUB_STEP_SUMMARY" || true

          # ---- 4. Gradle 8.7 pinned ----------------------------------------
          echo "::notice::Runner Gradle is $(gradle --version 2>/dev/null | awk '/^Gradle /{print $2}') - installing Gradle 8.7"
          curl -fsSL --retry 3 -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "export PATH=/opt/gradle-8.7/bin:$PATH" >> "$GITHUB_ENV"
          export PATH="/opt/gradle-8.7/bin:$PATH"
          hash -r
          echo "gradle binary in use: $(command -v gradle)" >> "$GITHUB_STEP_SUMMARY"
          gradle --version 2>&1 | head -8 >> "$GITHUB_STEP_SUMMARY" || true
          if ! gradle --version 2>/dev/null | grep -q '^Gradle 8\.'; then
            echo "::error::Gradle 8.7 did not take effect."
            exit 1
          fi

          # ---- 5. Point the build at the SDK ------------------------------
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties >> "$GITHUB_STEP_SUMMARY"

          # ---- 6. Build ---------------------------------------------------
          cd android
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "gradle exit code: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "### COMPILER ERRORS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE "(^|[^a-zA-Z])(e|w): file:|error:|Compilation error|What went wrong|FAILURE:|Execution failed|AAPT:|Unresolved reference|Cannot access|is internal in|None of the following" /tmp/build.log | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### LOG AROUND FIRST FAILURE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk '/FAILED|FAILURE:/{found=NR} {lines[NR]=$0} END{ if(found==0) found=40; start=found-120; if(start<1) start=1; for(i=start;i<=found;i++) print lines[i] }' /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### LAST 60 LOG LINES" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # ---- 7. Locate and publish the APK ------------------------------
          APK="$(find "$GITHUB_WORKSPACE/android" -name '*.apk' -type f 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced. See the build log in the job summary."
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK")
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$APK - $APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp "$APK" "$GITHUB_WORKSPACE/apk-out/connectdesk.apk"
          echo "APK_STAGED_AT=$GITHUB_WORKSPACE/apk-out/connectdesk.apk" >> "$GITHUB_ENV"

      - name: Upload APK (always runs, even if the build failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectdesk-debug-apk
          path: apk-out/connectdesk.apk
          if-no-files-found: warn

      - name: Upload build log (always runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectdesk-build-log
          path: /tmp/build.log
          if-no-files-found: warn
